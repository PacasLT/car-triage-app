<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administravimas — CarTriige</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
body { background: var(--bg-base); color: var(--text-primary); font-family: var(--font); margin: 0; }
.pg { max-width: 1240px; margin: 0 auto; padding: 26px 16px 90px; }
.pg-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.pg-head h1 { margin: 0; font: 700 22px/1.2 var(--font); }
.ad-ejimas { margin-left: 6px; font: 500 10px/1 var(--font-mono); letter-spacing: .06em; color: var(--text-dim); }
.ad-patikra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.ad-patikra > span { font-size: 13px; color: var(--text-muted); }
.pg-sub { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }

/* Skirtuku juosta - .ct-tab yra dizainerio, cia tik juosta */
.ad-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.ad-tabs .ct-tab { border-bottom: 2px solid transparent; background: transparent; padding: 0 14px; white-space: nowrap; }
.ad-tabs .ct-tab.active { border-bottom-color: var(--accent); color: var(--accent-light); font-weight: 600; }

/* Santraukos plyteles */
.ad-sant { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.ad-plyt { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
.ad-plyt b { display: block; font: 700 22px/1 var(--font-mono); margin-bottom: 4px; }
.ad-plyt span { font: 500 9.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
.ad-plyt.svarbu b { color: var(--accent-light); }

/* Isskleista eilute - viena celė per visa plotį */
.ad-detales { background: var(--bg-elevated); }
/* .chip gyvena ct-dizainas.css, kuris krauna VELIAU uz si <style>. Prie tos
   pacios specifikos jis nugalėtų, todel `.chip.ad-sena` - (0,2,0) vs (0,1,0). */
.chip.ad-istaisyta { border-color: var(--success-border); color: var(--success); }
.chip.ad-sena { border-color: var(--warning-border); color: var(--warning); }
.ad-irankiai { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; margin: 12px 0 4px; }
.ad-irankiu-zinia { font: var(--fw-regular) 11.5px/1.5 var(--font-mono); color: var(--text-muted); }
.ad-pre { margin: 0; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-surface); font: var(--fw-regular) 11.5px/1.6 var(--font-mono); color: var(--text-secondary); white-space: pre-wrap; word-break: break-word; }
.ad-detales > td { padding: 14px 13px !important; }
.ad-kom { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
.ad-kom-h { font: 600 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.ad-kom-tuscia { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.ad-kom-e { border-left: 2px solid var(--border-light); padding: 2px 0 2px 10px; margin-bottom: 8px; }
.ad-kom-kas { font: 600 11px/1.4 var(--font-mono); color: var(--text-secondary); margin-right: 8px; }
.ad-kom-l { font: 400 10px/1.4 var(--font-mono); color: var(--text-dim); }
.ad-kom-t { font-size: 13px; color: var(--text-primary); margin-top: 3px; white-space: pre-wrap; }
.ad-kom-f { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.ad-kom-f textarea { flex: 1 1 260px; min-width: 0; resize: vertical; }
.ad-vart-h { margin: 14px 0 10px; }
.ad-vart-e { font: 600 18px/1.2 var(--font); color: var(--text-primary); }
.ad-vart-m { font: 400 12px/1.5 var(--font-mono); color: var(--text-dim); margin-top: 4px; }
.ad-sk { display: flex; flex-wrap: wrap; gap: 18px; margin: 14px 0 18px; }
.ad-sk-e { display: flex; flex-direction: column; gap: 3px; min-width: 120px; }
.ad-sk-v { font: 700 26px/1 var(--font-mono); color: var(--text-primary); }
.ad-sk-v.ad-mazai { color: var(--warning); }
.ad-sk-v.ad-nulis { color: var(--danger); }
.ad-sk-p { font: 500 10px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); }
.ad-sk-z { flex: 1 1 100%; font-size: 12px; color: var(--text-muted); }
.ad-sekcija { margin: 18px 0; padding-top: 14px; border-top: 1px solid var(--border); }
.ad-sek-h { font: 600 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
.ad-kred-f { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ad-kred-f input { flex: 0 1 200px; min-width: 0; }
.ad-poveikis { margin-top: 12px; border: 1px solid var(--warning-border, var(--border-light)); border-radius: 12px; padding: 12px 14px; background: var(--bg-elevated); }
.ad-pov-h { font: 600 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--warning); margin-bottom: 8px; }
.ad-pov-v { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.ad-nepakis { font: 500 11px/1 var(--font-mono); color: var(--text-dim); margin-left: 6px; }
.ad-pre { max-height: 260px; overflow: auto; padding: 10px 12px; border-radius: 8px; background: var(--bg-base); font: 400 11px/1.55 var(--font-mono); color: var(--text-secondary); white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; }
.ad-foto { max-width: 100%; max-height: 240px; border-radius: 8px; border: 1px solid var(--border); display: block; margin-top: 10px; }
.ad-kelias { font: 500 10.5px/1.6 var(--font-mono); color: var(--text-muted); }
.ad-turejo { font: 400 12.5px/1.5 var(--font); color: var(--text-secondary); border-left: 2px solid var(--accent-border); padding-left: 10px; margin: 8px 0; }
.ad-veiksmai { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.ad-tr { cursor: pointer; }
</style>
</head>

<svg width="0" height="0" style="position: absolute; overflow: hidden" aria-hidden="true" focusable="false">
  <defs>

    <!-- rusiuoti · tvarka pagal reikšmę -->

    <!-- isskleisti -->

    <!-- pardavejas -->

    <!-- nuotraukos · vizualinė analizė -->

<div class="pg">
  <div class="pg-head"><h1>Administravimas</h1></div>
  <p class="pg-sub" id="ad-sub">Kraunama…</p>

  <div class="ad-tabs" id="ad-tabs" role="tablist">
    <button class="ct-tab active" data-t="klaidos" role="tab">Klaidos</button>
    <button class="ct-tab" data-t="matavimai" role="tab">Matavimai</button>
    <button class="ct-tab" data-t="vartotojai" role="tab">Vartotojai</button>
  </div>

  <div id="ad-turinys"></div>

<script>
(function () {
  'use strict';
  // v2.6.4 (Z-90): `e` - kieno ejimas. „Nepasitvirtino" dingo (buvo dviprasmis),
  // „Atideta" suskilo pagal tai, ko laukiama.
  var BUSENOS = [
    { k: 'rasta',             t: 'Rasta',             e: 'claude' },
    { k: 'patvirtinta',       t: 'Patvirtinta',       e: 'claude' },
    { k: 'tvarkoma',          t: 'Tvarkoma',          e: 'claude' },
    { k: 'laukia-patikros',   t: 'Laukia patikros',   e: 'lukas' },
    { k: 'laukia-sprendimo',  t: 'Laukia sprendimo',  e: 'lukas' },
    { k: 'laukia-dizainerio', t: 'Laukia dizainerio', e: 'dizaineris' },
    { k: 'sutvarkyta',        t: 'Sutvarkyta',        e: null },
    { k: 'neaktualu',         t: 'Neaktualu',         e: null }
  ];
  var EJIMAS = { claude: 'Claude', lukas: 'Jūs', dizaineris: 'Dizaineris' };
  var KAT = {
    dizainas: 'Atrodo ne taip', negyvas: 'Nieko neįvyko', duomenys: 'Neteisingas skaičius',
    kreditai: 'Nusirašė kreditas', greitis: 'Užstringa', prisijungimas: 'Prisijungimas', kita: 'Kita'
  };
  // v1.78.0 (Nr. 29): prioritetas vietoj „kiek trukdo". Raktai nekeiciami.
  var SVARBA = { blokuoja: 'Svarbu', trukdo: 'Vidutinis', smulkme: 'Mažiausiai svarbu' };

  var el = document.getElementById('ad-turinys');
  var sub = document.getElementById('ad-sub');
  var _rodyti = 'klaidos';
  var _visi = false;
  var _irasai = [];
  var _tekstas = /[?&]tekstas=1/.test(location.search);

  function zetonas() { try { return localStorage.getItem('ct_token') || ''; } catch (e) { return ''; } }
  function imti(kelias) {
    return fetch(kelias, { headers: { Authorization: 'Bearer ' + zetonas() } }).then(function (r) {
      // Revizija A-2: cia buvo VIENAS pranesimas abiem atvejams, ir jis melavo -
      // pasibaigusi sesija atrode kaip teisiu trukumas. 401 tvarko ct-sesija.js
      // (isvalo ir parodo „Sesija baigesi"), o 403 is tikruju yra teisiu klausimas.
      if (r.status === 401) throw new Error('Sesija baigėsi — prisijunkite iš naujo');
      if (r.status === 403) throw new Error('Reikia administratoriaus teisių');
      return r.json();
    });
  }
  function siusti(kelias, kunas, metodas) {
    return fetch(kelias, {
      method: metodas || 'POST',
      headers: { Authorization: 'Bearer ' + zetonas(), 'Content-Type': 'application/json' },
      body: kunas ? JSON.stringify(kunas) : undefined
    }).then(function (r) { return r.json(); });
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function laikas(ms) {
    if (!ms) return '—';
    var d = new Date(ms), p = function (x) { return String(x).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function ikona(v) { return '<i><svg class="ct-i"><use href="#' + v + '"></use></svg></i>'; }
  // 22b: tuscia nera klaida. Administravime ji daznai yra GERA naujiena.
  // is-good = nera ka taisyti, is-filtered = yra, bet ne siame vaizde, is-never = dar nieko nebuvo.
  function tuscia(rusis, antraste, tekstas, veiksmas) {
    var zenklas = { good: '✓', filtered: '≡', never: '·' }[rusis] || '·';
    return '<div class="ct-empty is-' + rusis + '"><i>' + zenklas + '</i>'
      + '<span class="ct-empty-t">' + esc(antraste) + '</span>'
      + '<span class="ct-empty-d">' + esc(tekstas) + '</span>'
      + (veiksmas || '') + '</div>';
  }

  // ── Klaidos ────────────────────────────────────────────────
  // 22 sk.: ta pati sistema, bet tankiau. Lentele, nes cia dirbama su 200 irasu,
  // ne su vienu automobiliu. Skubi eilute gauna LINIJA kaireje, ne raudona fona:
  // raudonas fonas 30 eiluciu sarase padaro visa ekrana signalu.
  var _isskleista = null;

  function busenosZenklas(b) {
    // Tie patys zinojimo lygiai, ne naujos spalvos.
    var lygis = (b === 'sutvarkyta' || b === 'neaktualu') ? 'ct-k-confirmed'
      : (b === 'tvarkoma' || b === 'patvirtinta' || b === 'laukia-patikros') ? 'ct-k-signal'
      : 'ct-k-unknown';
    var bb = BUSENOS.filter(function (x) { return x.k === b; })[0] || {};
    return '<span class="ct-k ' + lygis + '"><i></i>' + esc(bb.t || b) + '</span>'
      + (bb.e ? '<span class="ad-ejimas">' + esc(EJIMAS[bb.e]) + '</span>' : '');
  }

  // v1.57.0: visas sarasas PLOKSCIU TEKSTU. Kam: taisytojas puslapio nemato taip,
  // kaip zmogus - jam reikia visko is karto, vienoje vietoje, be spaudymo. Adresu
  // ?tekstas=1 puslapis atsidaro tiesiai si rezimu.
  function tekstoIsklotine(d) {
    var NL = String.fromCharCode(10);
    var e = [];
    e.push('CARTRIIGE KLAIDOS  ' + new Date().toISOString().slice(0, 16).replace('T', ' '));
    e.push('Is viso ' + d.viso + ' | atviru ' + d.atviru + ' | laukia jusu ' + d.lauksiaJusu);
    e.push('Pagal busena: ' + JSON.stringify(d.pagalBusena || {}));
    e.push('');
    d.irasai.forEach(function (k) {
      e.push('================================================================');
      e.push(tekstasVieno(k));
    });
    return e.join(NL);
  }

  // Vienas irasas tekstu - naudoja ir isklotine, ir mygtukas „Kopijuoti".
  function tekstasVieno(k) {
    var NL = String.fromCharCode(10);
    var e = [];
    (function () {
      var g = k.diagnostika || {}, ek = g.ekranas || {};
      e.push('#' + k.nr + '  ' + k.busena + '  svarba=' + k.svarba + '  kategorija=' + k.kategorija
        + (k.kartojasi ? '  KARTOJASI' : '') + (k.foto ? '  [NUOTRAUKA]' : '')
        + (k.persiustas ? '  [PERSIUSTAS IS EILES - laikas yra GAVIMO, ne ivykio]' : '')
        + (k.fotoNumesta ? '  [NUOTRAUKA NETILPO]' : ''));
      e.push(new Date(k.laikas).toISOString().slice(0, 16).replace('T', ' ') + '  ' + (k.kas || 'neprisijunges'));
      e.push('');
      e.push('TEKSTAS: ' + k.tekstas);
      if (k.turejoRodyti) e.push('TUREJO RODYTI: ' + k.turejoRodyti);
      if (k.vieta) e.push('PARODE VIETA: ' + (k.vieta.tekstas || '-') + '   ' + k.vieta.elementas
        + '   ' + (k.vieta.dydis || '') + ' @ ' + (k.vieta.vieta || ''));
      if (k.perkrovus) e.push('PERKROVE PUSLAPI - liko taip pat');
      if (k.kada) e.push('PIRMA KARTA PASTEBEJO: ' + ({siandien:'siandien', savaite:'sia savaite', seniai:'seniai'}[k.kada] || k.kada));
      e.push('');
      var dbr = dabartineVersija();
      var senesne = g.versija && dbr && versijaSkaicium(g.versija) < versijaSkaicium(dbr);
      var istV = istaisymoVersija(k);
      e.push('PUSLAPIS: ' + (g.puslapis || '?') + '  v' + (g.versija || '?')
        + (istV ? '  [ISTAISYTA v' + istV + ']' : (senesne ? '  [PRANESTA v' + g.versija + ', DABAR v' + dbr + ' - galejo buti istaisyta]' : ''))
        + '  ' + (ek.plotis || '?') + 'x' + (ek.aukstis || '?') + '@' + (ek.tankis || '?')
        + '  planas=' + ((g.planas || {}).planas || '?')
        + '  kreditai=' + ((g.planas || {}).kreditai == null ? '?' : g.planas.kreditai)
        + (g.nuoIkelimo != null ? '  po ' + Math.round(g.nuoIkelimo / 1000) + ' s nuo ikelimo' : '')
        + (g.tinklas ? '  tinklas=' + g.tinklas : ''));
      if (g.adresas) e.push('ADRESAS: ' + g.adresas);
      if (g.skelbimas) e.push('SKELBIMAS: ' + (g.skelbimas.pavadinimas || '?') + '  ' + (g.skelbimas.url || ''));
      if (g.narsykle) e.push('NARSYKLE: ' + g.narsykle);
      if (g.saugyklosRaktai) e.push('SAUGYKLOS RAKTAI: ' + g.saugyklosRaktai.join(', '));
      if ((g.veiksmai || []).length) {
        e.push('');
        e.push('PASPAUDIMAI (paskutinis apacioje):');
        g.veiksmai.forEach(function (v) { e.push('   ' + (v.tekstas || '') + '   ' + (v.elementas || '')); });
      }
      if ((g.klaidos || []).length) {
        e.push('');
        e.push('JS KLAIDOS:');
        g.klaidos.forEach(function (x) {
          e.push('   ' + x.zinute + (x.failas ? '   (' + x.failas + ':' + x.eilute + ')' : ''));
          if (x.stekas) e.push('     ' + String(x.stekas).split(String.fromCharCode(10)).slice(0, 3).join(' | '));
        });
      }
      if ((g.uzklausos || []).length) {
        e.push('');
        e.push('NEPAVYKUSIOS UZKLAUSOS:');
        g.uzklausos.forEach(function (x) { e.push('   ' + x.kodas + '  ' + (x.tipas || '') + '  ' + x.adresas); });
      }
      if ((k.istorija || []).length) {
        e.push('');
        e.push('KELIAS: ' + k.istorija.map(function (x) { return x.busena; }).join(' -> '));
      }
      if (k.foto) e.push('NUOTRAUKA: /admin/klaidos/' + k.nr + '/foto');
    })();
    return e.join(NL);
  }

  window.adTekstas = function (v) {
    _tekstas = v;
    piestiKlaidas();
  };

  function piestiKlaidas() {
    el.innerHTML = '<div class="ct-empty is-never"><i>·</i><span class="ct-empty-t">Kraunama…</span></div>';
    imti('/admin/klaidos' + (_visi ? '?visi=1' : '')).then(function (d) {
      _irasai = d.irasai || [];
      sub.textContent = 'Iš viso ' + d.viso + ' · atvirų ' + d.atviru + ' · laukia jūsų ' + d.lauksiaJusu;
      var h = '<div class="ad-sant">'
        + '<div class="ad-plyt' + (d.lauksiaJusu ? ' svarbu' : '') + '"><b>' + d.lauksiaJusu + '</b><span>laukia jūsų patikros</span></div>'
        + '<div class="ad-plyt"><b>' + d.atviru + '</b><span>atvirų</span></div>'
        + '<div class="ad-plyt"><b>' + d.viso + '</b><span>iš viso</span></div>'
        + '</div>'
        + '<div class="ct-flags" style="margin-bottom:14px">'
        +   '<button type="button" class="ct-flag" role="radio" aria-checked="' + (!_visi) + '" onclick="adVisi(false)">Tik atviros</button>'
        +   '<button type="button" class="ct-flag" role="radio" aria-checked="' + (!!_visi) + '" onclick="adVisi(true)">Visos</button>'
        + '</div>'
        + '<div class="ct-flags" style="margin-bottom:14px">'
        +   '<button type="button" class="ct-flag" role="radio" aria-checked="' + (!_tekstas) + '" onclick="adTekstas(false)">Lentelė</button>'
        +   '<button type="button" class="ct-flag" role="radio" aria-checked="' + (!!_tekstas) + '" onclick="adTekstas(true)">Viskas tekstu</button>'
        + '</div>';

      if (_tekstas) {
        el.innerHTML = h + '<pre id="ad-tekstas" class="ad-pre"></pre>';
        document.getElementById('ad-tekstas').textContent = tekstoIsklotine(d);
        return;
      }

      if (!d.irasai.length) {
        el.innerHTML = h + (d.viso === 0
          ? tuscia('never', 'Pranešimų dar nėra', 'Kai kas nors paspaus mygtuką „Klaida", pranešimas atsiras čia.')
          : _visi
            ? tuscia('good', 'Tuščia', 'Nieko nėra rodyti.')
            : tuscia('good', 'Naujų klaidų nėra',
                'Visi ' + d.viso + ' pranešimai uždaryti – sutvarkyti arba neaktualūs.',
                '<div class="ct-empty-n"><button type="button" class="ct-btn ct-btn-sm" onclick="adVisi(true)"><span>Rodyti visas</span></button></div>'));
        return;
      }

      h += '<div class="ct-table-w"><table class="ct-table is-dense"><thead><tr>'
        + '<th class="is-num">NR.</th><th class="is-prio">PRIORITETAS</th><th>KATEGORIJA</th><th>KLAIDA</th>'
        + '<th class="is-time">KADA</th><th>VERSIJA</th><th>BŪSENA</th><th class="is-act"></th>'
        + '</tr></thead><tbody>'
        + d.irasai.map(eilute).join('')
        + '</tbody></table></div>';
      el.innerHTML = h;
      uzkrautiFoto();
    }).catch(function (e) {
      el.innerHTML = tuscia('never', 'Nepavyko įkelti', e.message);
      sub.textContent = '';
    });
  }

  function eilute(k) {
    var skubu = k.svarba === 'blokuoja';
    var uzdaryta = k.busena === 'sutvarkyta' || k.busena === 'neaktualu';
    var dg = k.diagnostika || {};
    var eil = '<tr class="ad-tr' + (skubu ? ' is-urgent' : '') + (uzdaryta ? ' is-done' : '') + '" onclick="adIsskleisti(' + k.nr + ')">'
      // v1.80.0 (32 sk.): kiekvienam <td> - data-stulpelis. Telefone eilute
      // tampa kortele, ir etikete ateina is sio atributo. Be jo kortelėje butu
      // reiksme be vardo - blogiau uz suspausta lentele (17 paketas, 2.3).
      + '<td class="is-num" data-stulpelis="NR.">' + k.nr + '</td>'
      + '<td class="is-prio" data-stulpelis="PRIORITETAS">' + prioZenklas(k) + '</td>'
      + '<td data-stulpelis="KATEGORIJA">' + esc(KAT[k.kategorija] || k.kategorija || '—')
      +   (k.kartojasi ? ' <span class="chip">kartojasi</span>' : '') + '</td>'
      + '<td class="is-text" data-stulpelis="KLAIDA"><span class="ct-clamp">' + esc(k.tekstas) + '</span></td>'
      + '<td class="is-time" data-stulpelis="KADA">' + laikas(k.laikas) + '</td>'
      + '<td class="is-time" data-stulpelis="VERSIJA">' + versijosZyme(k) + '</td>'
      + '<td data-stulpelis="BŪSENA">' + busenosZenklas(k.busena) + '</td>'
      + '<td class="is-act" data-stulpelis="">'
      +   '<button class="ct-btn ct-btn-quiet ct-btn-icon ct-btn-sm is-destructive" title="Ištrinti visiškai"'
      +     ' aria-label="Ištrinti pranešimą" onclick="event.stopPropagation();adTrinti(' + k.nr + ')">' + ikona('i-pasalinti') + '</button>'
      + '</td></tr>';
    if (_isskleista !== k.nr) return eil;

    var ek = dg.ekranas || {};
    return eil + '<tr class="ad-detales"><td colspan="8">'
      + '<div class="ad-meta ad-kelias">' + esc(k.kas || 'neprisijungęs')
      +   (dg.puslapis ? ' · ' + esc(dg.puslapis) : '')
      +   (dg.versija ? ' · v' + esc(dg.versija) : '')
      +   (ek.plotis ? ' · ' + ek.plotis + ' px' : '')
      +   ' · ' + esc(SVARBA[k.svarba] || k.svarba || '') + '</div>'
      + (k.turejoRodyti ? '<div class="ad-turejo"><b>Turėjo rodyti:</b> ' + esc(k.turejoRodyti) + '</div>' : '')
      + (k.istorija && k.istorija.length > 1
          ? '<div class="ad-kelias">' + k.istorija.map(function (x) { return esc(x.busena); }).join(' → ') + '</div>' : '')
      + (k.foto ? '<img class="ad-foto" data-foto="' + k.nr + '" alt="" style="cursor:zoom-in">' : '')
      + ((dg.veiksmai || []).length
          ? '<details open><summary>Ką spaudė prieš tai (' + dg.veiksmai.length + ')</summary><pre class="ad-pre">'
            + dg.veiksmai.map(function (v) { return esc((v.tekstas || '—') + '   ' + (v.elementas || '')); }).join(String.fromCharCode(10))
            + '</pre></details>' : '')
      + '<details><summary>Visa diagnostika</summary><pre class="ad-pre">' + esc(JSON.stringify(dg, null, 1)) + '</pre></details>'
      + '<div class="ad-irankiai">'
      +   (dg.adresas
            ? '<button type="button" class="ct-btn ct-btn-sm" onclick="event.stopPropagation();adAtkurti(' + k.nr + ')">'
              + '<span>Atkurti ' + (ek.plotis ? ek.plotis + '×' + (ek.aukstis || '?') : '') + '</span></button>'
            : '')
      +   ((dg.uzklausos || []).length
            ? '<button type="button" class="ct-btn ct-btn-sm" onclick="event.stopPropagation();adTikrinti(' + k.nr + ')">'
              + '<span>Patikrinti užklausas (' + dg.uzklausos.length + ')</span></button>'
            : '')
      +   '<button type="button" class="ct-btn ct-btn-sm" onclick="event.stopPropagation();adKopijuoti(' + k.nr + ')">'
      +     '<span>Kopijuoti</span></button>'
      +   '<span class="ad-irankiu-zinia" id="ad-iz-' + k.nr + '"></span>'
      + '</div>'
      + (k.busena === 'laukia-patikros'
          ? '<div class="ad-patikra"><span>Patikrinot?</span>'
            + '<button type="button" class="ct-btn ct-btn-sm ct-btn-primary" onclick="event.stopPropagation();adPatikra(' + k.nr + ', true)"><span>✓ Veikia</span></button>'
            + '<button type="button" class="ct-btn ct-btn-sm" onclick="event.stopPropagation();adPatikra(' + k.nr + ', false)"><span>✗ Neveikia</span></button>'
            + '</div>' : '')
      + komentaruSritis(k)
      + '<div class="ad-veiksmai">'
      +   BUSENOS.map(function (b) {
            return '<button type="button" class="ct-flag" role="radio" aria-checked="' + (b.k === k.busena)
              + '" onclick="event.stopPropagation();adBusena(' + k.nr + ', &quot;' + b.k + '&quot;)">' + b.t + '</button>';
          }).join('')
      + '</div></td></tr>';
  }

  // v1.80.0: komentarai. Tikrinant pataisyma daznai paaiskeja, kad ne viskas -
  // tada reikia ne naujo pranesimo, o eilutes prie to paties. Visa istorija
  // vienoje vietoje, ir busena pasikeicia pati (laukia-patikros -> patvirtinta).
  function komentaruSritis(k) {
    var sar = k.komentarai || [];
    var h = '<div class="ad-kom">';
    h += '<div class="ad-kom-h">Komentarai' + (sar.length ? ' (' + sar.length + ')' : '') + '</div>';
    if (!sar.length) {
      h += '<div class="ad-kom-tuscia">Dar nėra. Rašykit čia, jei tikrinant kas nors neveikia – nereikia naujo pranešimo.</div>';
    } else {
      h += sar.map(function (x) {
        return '<div class="ad-kom-e"><span class="ad-kom-kas">' + esc(x.kas || '?')
          + '</span><span class="ad-kom-l">' + laikas(x.laikas)
          + (x.busena ? ' · ' + esc(x.busena) : '') + '</span>'
          + '<div class="ad-kom-t">' + esc(x.tekstas || '') + '</div></div>';
      }).join('');
    }
    h += '<div class="ad-kom-f">'
      + '<textarea class="ct-field" id="ad-kom-i-' + k.nr + '" rows="2" placeholder="Kas dar ne taip?" onclick="event.stopPropagation()"></textarea>'
      + '<button type="button" class="ct-btn ct-btn-sm" onclick="event.stopPropagation();adKomentuoti(' + k.nr + ')"><span>Pridėti</span></button>'
      + '<span class="ad-irankiu-zinia" id="ad-kz-' + k.nr + '"></span>'
      + '</div></div>';
    return h;
  }

  // v1.91.0 (18 paketas, 33 sk.): PRIORITETAS.
  //
  // Dizainerio klausimas buvo tikslus: pranesimas su 5 pasikartojimais ir
  // parasytas viena karta sarase atrodo vienodai. Prioritetas surenkamas is to,
  // kas JAU irasyta - naujo lauko nereikia:
  //
  //   svarba       blokuoja / trukdo / smulkme   (Luko pasirinkimas pranesant)
  //   kartojasi    kiek kartu tas pats atsitiko
  //   amzius       kiek dienu kabo neuzdarytas
  //
  // Taskai, ne spalvos - ir tai dizainerio sprendimas, kuri verta uzrasyti:
  // klaidu sarase zalia JAU reiskia „istaisyta", tad raudona/geltona/zalia
  // duotu vienoje eiluteje dvi skirtingas zalios prasmes.
  function prioritetas(k) {
    var b = 0;
    if (k.svarba === 'blokuoja') b += 3;
    else if (k.svarba === 'trukdo') b += 2;
    else b += 1;
    var kart = parseInt(k.kartojasi, 10) || 0;
    if (kart >= 5) b += 2; else if (kart >= 2) b += 1;
    var dienos = (Date.now() - (k.laikas || Date.now())) / 86400000;
    if (dienos >= 7) b += 1;
    return b >= 5 ? 3 : (b >= 3 ? 2 : 1);
  }
  var PRIO_T = { 1: 'Žemas', 2: 'Vidutinis', 3: 'Svarbu' };
  function prioZenklas(k) {
    var lyg = prioritetas(k);
    return '<span class="ct-prio is-' + lyg + '"><i></i><i></i><i></i></span>'
      + '<span class="ct-prio-t">' + PRIO_T[lyg] + '</span>';
  }

  // v1.65.0: prie kiekvieno pranesimo - versija, KURIOJE jis parasytas, ir ar ji
  // senesne uz dabartine. Pranesimas is v1.60.0, kai jau v1.65.0, gali buti jau
  // istaisytas - tai matyti is karto, o ne po atkurimo bandymo.
  function dabartineVersija() {
    try { return (window.CT_VERSIJOS && window.CT_VERSIJOS[0] && window.CT_VERSIJOS[0].versija) || null; }
    catch (e) { return null; }
  }
  function versijaSkaicium(v) {
    return String(v || '').split('.').map(function (x) { return parseInt(x, 10) || 0; })
      .reduce(function (a, x) { return a * 1000 + x; }, 0);
  }
  // v1.70.0 (pranesimas Nr.17): rodom DVI versijas - kurioje rasta ir kuria
  // istaisyta. Antroji jau buvo kaupiama busenu istorijoje (`versija` prie
  // kiekvieno perjungimo), tik niekur nerodoma. Jei dar neistaisyta, rodom
  // dabartine su rodykle - tada matyti, kiek versiju prabego be atsakymo.
  function istaisymoVersija(k) {
    var ist = k.istorija || [];
    for (var i = 0; i < ist.length; i++) {
      if ((ist[i].busena === 'laukia-patikros' || ist[i].busena === 'sutvarkyta') && ist[i].versija) {
        return ist[i].versija;
      }
    }
    return null;
  }
  function versijosZyme(k) {
    var v = ((k.diagnostika || {}).versija) || null;
    if (!v) return '<span class="ad-meta">?</span>';
    var ist = istaisymoVersija(k);
    if (ist) {
      return '<span class="chip">v' + esc(v) + '</span>'
        + '<span class="ad-meta"> → </span>'
        + '<span class="chip ad-istaisyta" title="Ištaisyta">v' + esc(ist) + '</span>';
    }
    var dbr = dabartineVersija();
    var sena = dbr && versijaSkaicium(v) < versijaSkaicium(dbr);
    return '<span class="chip' + (sena ? ' ad-sena' : '') + '">v' + esc(v)
      + (sena ? ' → v' + esc(dbr) : '') + '</span>';
  }

  function pagalNr(nr) { return (_irasai || []).filter(function (x) { return x.nr === nr; })[0]; }
  function zinia(nr, t) { var e = document.getElementById('ad-iz-' + nr); if (e) e.textContent = t; }

  // „Atkurti" — atidaro TA PATI adresa TOKIO PAT dydzio lange. Butent sito
  // truko: du siandienos dizaino pranesimai buvo apie plocius (3152 ir 385 px),
  // ir abu teko atkurti rankomis, spejant dydi.
  window.adAtkurti = function (nr) {
    var k = pagalNr(nr); if (!k) return;
    var g = k.diagnostika || {}, ek = g.ekranas || {};
    if (!g.adresas) return zinia(nr, 'Adreso pranesime nera.');
    var sav = ek.plotis ? 'width=' + Math.min(ek.plotis, screen.availWidth) + ',height=' + Math.min(ek.aukstis || 900, screen.availHeight) : '';
    window.open(g.adresas, '_blank', sav);
    zinia(nr, 'Atidaryta' + (sav ? ' ' + ek.plotis + '×' + ek.aukstis + ' px lange.' : '.'));
  };

  // Mokami marsrutai NIEKADA nekvieciami automatiskai - mygtukas, kviecianti
  // juos kas paspaudima, tyliai pravalgytu kreditus. Rodom su kaina, be kvietimo.
  var MOKAMI = /\/api\/(analyze-single|compare-deep|vin-lookup|seller-lookup|history-counts)/;

  window.adTikrinti = function (nr) {
    var k = pagalNr(nr); if (!k) return;
    var u = ((k.diagnostika || {}).uzklausos) || [];
    if (!u.length) return zinia(nr, 'Uzklausu pranesime nera.');
    zinia(nr, 'Tikrinama…');
    var eil = [], liko = u.length;
    u.forEach(function (x, i) {
      var buvo = x.kodas == null ? 'tinklas' : x.kodas;
      if (MOKAMI.test(x.adresas)) {
        eil[i] = x.adresas + '   buvo ' + buvo + '   — MOKAMAS, nekviesta';
        if (!--liko) baigti();
        return;
      }
      if (x.metodas && x.metodas.toUpperCase() !== 'GET') {
        eil[i] = x.adresas + '   buvo ' + buvo + '   — ' + x.metodas + ', nekartojama';
        if (!--liko) baigti();
        return;
      }
      var antr = {};
      try { var z = localStorage.getItem('ct_token'); if (z) antr.Authorization = 'Bearer ' + z; } catch (e) {}
      fetch(x.adresas, { headers: antr })
        .then(function (r) { eil[i] = x.adresas + '   buvo ' + buvo + '   dabar ' + r.status + (r.ok ? '  VEIKIA' : ''); })
        .catch(function () { eil[i] = x.adresas + '   buvo ' + buvo + '   dabar: nepavyko prisijungti'; })
        .then(function () { if (!--liko) baigti(); });
    });
    function baigti() {
      var el = document.getElementById('ad-tikr-' + nr);
      if (!el) {
        el = document.createElement('pre');
        el.className = 'ad-pre'; el.id = 'ad-tikr-' + nr;
        el.style.marginTop = '10px';
        var t = document.getElementById('ad-iz-' + nr);
        if (t && t.parentNode) t.parentNode.appendChild(el);
      }
      el.textContent = eil.join(String.fromCharCode(10));
      zinia(nr, '');
    }
  };

  window.adKopijuoti = function (nr) {
    var k = pagalNr(nr); if (!k) return;
    var t = tekstasVieno(k);
    var gerai = function () { zinia(nr, 'Nukopijuota.'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(gerai, function () { zinia(nr, 'Nepavyko — pasirinkite ranka.'); });
        return;
      }
    } catch (e) {}
    zinia(nr, 'Naršyklė neleidžia kopijuoti — naudokite „Viskas tekstu".');
  };

  // Nuotraukos negalima paduoti per <img src> - marsrutas reikalauja antrastes,
  // o <img> jos nesiuncia (patikrinta produkcijoje: 401). Todel paimam su
  // antraste ir paduodam kaip blob. Rakto i adresa nededam niekada.
  var _fotoUrl = {};
  function uzkrautiFoto() {
    document.querySelectorAll('img.ad-foto[data-foto]').forEach(function (img) {
      var nr = img.getAttribute('data-foto');
      if (_fotoUrl[nr]) { img.src = _fotoUrl[nr]; pridetiDidinima(img, nr); return; }
      var antr = {};
      try { var z = localStorage.getItem('ct_token'); if (z) antr.Authorization = 'Bearer ' + z; } catch (e) {}
      fetch('/admin/klaidos/' + nr + '/foto', { headers: antr })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function (b) { _fotoUrl[nr] = URL.createObjectURL(b); img.src = _fotoUrl[nr]; pridetiDidinima(img, nr); })
        .catch(function (e) { img.replaceWith(Object.assign(document.createElement('div'),
          { className: 'ad-meta', textContent: 'Nuotraukos nepavyko uzkrauti (' + e.message + ')' })); });
    });
  }
  function pridetiDidinima(img, nr) {
    img.onclick = function (e) { e.stopPropagation(); window.open(_fotoUrl[nr], '_blank'); };
    img.title = 'Paspauskite, kad atidarytumete atskirame lange';
  }

  window.adIsskleisti = function (nr) { _isskleista = (_isskleista === nr ? null : nr); piestiKlaidas(); };
  window.adVisi = function (v) { _visi = v; _isskleista = null; piestiKlaidas(); };
  window.adKomentuoti = function (nr) {
    var el = document.getElementById('ad-kom-i-' + nr);
    var z = document.getElementById('ad-kz-' + nr);
    var t = el ? el.value.trim() : '';
    if (!t) { if (z) z.textContent = 'Tuščia.'; return; }
    if (z) z.textContent = 'Siunčiama...';
    siusti('/admin/klaidos/' + nr + '/komentaras', { tekstas: t }).then(function (r) {
      if (el) el.value = '';
      // Perpiesim PIRMA, tada rasom zinia: piestiKlaidas() atkuria ta pacia
      // eilute is naujo, tad anksciau irasyta zinia dingtu kartu su senu span'u.
      piestiKlaidas();
      var z2 = document.getElementById('ad-kz-' + nr);
      if (z2) z2.textContent = (r && r.busenaPakeista) ? 'Pridėta, būsena → ' + r.busenaPakeista : 'Pridėta.';
    }).catch(function (e) { if (z) z.textContent = 'Nepavyko: ' + e.message; });
  };

  window.adBusena = function (nr, b) {
    var v = null;
    try { v = (window.CT_VERSIJOS && window.CT_VERSIJOS[0] && window.CT_VERSIJOS[0].versija) || null; } catch (e) {}
    siusti('/admin/klaidos/' + nr + '/busena', { busena: b, versija: v }).then(piestiKlaidas);
  };
  // v2.6.4: „Neveikia" - ne busena, o grazinimas i darba su priezastimi is
  // komentaro lauko (jei parasyta). „Veikia" - uzdaro kaip sutvarkyta.
  window.adPatikra = function (nr, veikia) {
    var v = null;
    try { v = (window.CT_VERSIJOS && window.CT_VERSIJOS[0] && window.CT_VERSIJOS[0].versija) || null; } catch (e) {}
    var laukas = document.getElementById('ad-kom-i-' + nr);
    var t = laukas ? laukas.value.trim() : '';
    siusti('/admin/klaidos/' + nr + '/busena', veikia
      ? { busena: 'sutvarkyta', versija: v, pastaba: t || null }
      : { busena: 'patvirtinta', versija: v, pastaba: 'Neveikia' + (t ? ': ' + t : '') }).then(piestiKlaidas);
  };
  window.adTrinti = function (nr) {
    if (!window.confirm('Ištrinti pranešimą Nr. ' + nr + ' visiškai? Šito atšaukti nebus galima.')) return;
    siusti('/admin/klaidos/' + nr, null, 'DELETE').then(piestiKlaidas);
  };

  // ── Matavimai ──────────────────────────────────────────────
  function lentele(pav, o) {
    var r = Object.keys(o).map(function (k) {
      return '<tr><td>' + esc(k) + '</td><td class="is-num">' + o[k] + '</td></tr>';
    }).join('');
    return '<h2 style="font:600 13px var(--font);margin:18px 0 8px">' + esc(pav) + '</h2>'
      + '<div class="ct-table-w"><table class="ct-table is-dense"><tbody>' + r + '</tbody></table></div>';
  }

  function piestiMatavimus() {
    el.innerHTML = '';
    imti('/admin/atsarga').then(function (d) {
      sub.textContent = 'Nuo paleidimo ' + d.nuoPaleidimoVal + ' val.';
      var p = d.puppeteer || {};
      el.innerHTML = '<div class="ad-sant">'
        + '<div class="ad-plyt"><b>' + (p.pasiektas || 0) + '</b><span>puppeteer pasiektas</span></div>'
        + '<div class="ad-plyt"><b>' + (p.pavyko || 0) + '</b><span>pavyko</span></div>'
        + '<div class="ad-plyt"><b>' + (p.nepavyko || 0) + '</b><span>nepavyko</span></div>'
        + '</div>'
        + '<div class="ct-table-w" style="padding:14px 16px;font:400 13.5px/1.55 var(--font)">' + esc(d.isvada) + '</div>'
        + lentele('Paieškos puslapiai', d.paieskosPuslapiai || {})
        + lentele('Skelbimų puslapiai', d.skelbimuPuslapiai || {})
        + (Object.keys(p.klaidos || {}).length ? lentele('Puppeteer klaidos', p.klaidos) : '');
    }).catch(function (e) { el.innerHTML = tuscia('never', 'Nepavyko įkelti', e.message); sub.textContent = ''; });
  }

  // ── Vartotojai ─────────────────────────────────
  // v1.81.0 (13 paketas, D-16). Du dalykai, kuriuos dizaineris prase pridėti
  // backend'e, JAU BUVO: /admin/vartotojai grazina `created_at`, o /api/planas
  // grazina `planai` su `kreditaiMen`. Patikrinta gyvai, zr. Z-27.
  //
  // Sena lentele skaitė `u.planas` ir `u.sukurta` - tokiu lauku API negrazina
  // (yra `plan` ir `created_at`), tad planas visiems rodesi „trial", o data
  // visiems „—". Ta pati klaida abiejuose stulpeliuose.
  var _vartotojas = null;
  var _planai = null;

  function planoVardas(k) {
    return (_planai && _planai[k] && _planai[k].pavadinimas) || k || '—';
  }
  function planoRiba(k, laukas) {
    return (_planai && _planai[k]) ? _planai[k][laukas] : null;
  }
  function paieskuRiba(k) {
    var men = planoRiba(k, 'paieskosMen'), viso = planoRiba(k, 'paieskosViso');
    if (viso != null) return viso + ' iš viso';
    if (men != null) return men + ' per mėn.';
    return 'neribota';
  }

  function piestiVartotojus() {
    el.innerHTML = '';
    _vartotojas = null;
    Promise.all([imti('/admin/vartotojai'), _planai ? Promise.resolve(null) : imti('/api/planas')])
      .then(function (r) {
        if (r[1] && r[1].planai) _planai = r[1].planai;
        var v = (r[0] && r[0].vartotojai) || [];
        sub.textContent = 'Iš viso ' + v.length + ' vartotojų';
        if (!v.length) {
          el.innerHTML = tuscia('never', 'Vartotojų nėra', 'Dar niekas neužsiregistravo.');
          return;
        }
        window._vartotojai = v;
        el.innerHTML = '<div class="ct-table-w"><table class="ct-table is-dense"><thead><tr>'
          + '<th>EL. PAŠTAS</th><th>PLANAS</th><th class="is-num">PLANO KR.</th>'
          + '<th class="is-num">PIRKTI KR.</th><th class="is-num">PAIEŠKOS</th><th class="is-time">NUO</th>'
          + '</tr></thead><tbody>'
          + v.map(function (u, i) {
              return '<tr class="ad-tr" onclick="adVartotojas(' + i + ')">'
                + '<td class="is-id" data-stulpelis="EL. PAŠTAS">' + esc(u.email || '—') + '</td>'
                + '<td data-stulpelis="PLANAS"><span class="chip">' + esc(planoVardas(u.plan)) + '</span></td>'
                + '<td class="is-num" data-stulpelis="PLANO KR.">' + (u.kreditai_plano || 0) + '</td>'
                + '<td class="is-num" data-stulpelis="PIRKTI KR.">' + (u.kreditai_pirkti || 0) + '</td>'
                + '<td class="is-num" data-stulpelis="PAIEŠKOS">' + (u.paieskos_menesi || 0) + '</td>'
                + '<td class="is-time" data-stulpelis="NUO">' + (u.created_at ? laikas(u.created_at) : '—') + '</td></tr>';
            }).join('')
          + '</tbody></table></div>';
      }).catch(function (e) { el.innerHTML = tuscia('never', 'Nepavyko įkelti', e.message); sub.textContent = ''; });
  }

  window.adVartotojas = function (i) {
    var u = (window._vartotojai || [])[i];
    if (!u) return;
    _vartotojas = u;
    piestiVartotoja();
  };

  function skaitikliai(u) {
    var pl = u.kreditai_plano || 0, pi = u.kreditai_pirkti || 0;
    var men = planoRiba(u.plan, 'kreditaiMen');
    var t = pl === 0 ? 'ad-nulis' : (men && pl <= men * 0.2 ? 'ad-mazai' : '');
    return '<div class="ad-sk">'
      + '<div class="ad-sk-e"><span class="ad-sk-v ' + t + '">' + pl + '</span>'
      +   '<span class="ad-sk-p">plano kreditai' + (men != null ? ' · riba ' + men : '') + '</span></div>'
      + '<div class="ad-sk-e"><span class="ad-sk-v">' + pi + '</span>'
      +   '<span class="ad-sk-p">pirkti · nesibaigia</span></div>'
      + '<div class="ad-sk-e"><span class="ad-sk-v">' + (u.paieskos_menesi || 0) + '</span>'
      +   '<span class="ad-sk-p">paieškos šį mėn. · ' + paieskuRiba(u.plan) + '</span></div>'
      + '<div class="ad-sk-z">Nurašoma pirmiausia iš plano kreditų; pirktieji liečiami tik jiems pasibaigus.</div>'
      + '</div>';
  }

  function piestiVartotoja() {
    var u = _vartotojas;
    sub.textContent = u.email;
    el.innerHTML = '<button type="button" class="ct-back ct-btn ct-btn-sm" onclick="piestiVartotojus()"><span>← Vartotojai</span></button>'
      + '<div class="ad-vart-h"><div class="ad-vart-e">' + esc(u.email) + '</div>'
      +   '<div class="ad-vart-m">' + esc(planoVardas(u.plan))
      +     (u.plan_iki ? ' · iki ' + esc(u.plan_iki) : '')
      +     (u.created_at ? ' · nuo ' + laikas(u.created_at) : '')
      +     (u.is_admin ? ' · administratorius' : '') + '</div></div>'
      + skaitikliai(u)
      + '<div class="ad-sekcija"><div class="ad-sek-h">PLANAS</div>'
      +   '<div class="ct-flags" role="radiogroup">'
      +     ['trial', 'pro', 'business'].map(function (k) {
            return '<button type="button" class="ct-flag" role="radio" aria-checked="' + (k === u.plan)
              + '" onclick="adPlanoPasirinkimas(&quot;' + k + '&quot;)">' + esc(planoVardas(k)) + '</button>';
          }).join('')
      +   '</div><div id="ad-plano-poveikis"></div></div>'
      + '<div class="ad-sekcija"><div class="ad-sek-h">PRIDĖTI KREDITŲ</div>'
      +   '<div class="ad-kred-f">'
      +     '<input class="ct-field" id="ad-kr-kiekis" type="number" step="1" placeholder="kiek">'
      +     '<input class="ct-field" id="ad-kr-pastaba" type="text" placeholder="kodėl (matysis žurnale)">'
      +     '<button type="button" class="ct-btn ct-btn-sm" onclick="adKredituPrideti()"><span>Pridėti</span></button>'
      +     '<span class="ad-irankiu-zinia" id="ad-kr-z"></span>'
      +   '</div></div>'
      + '<div class="ad-sekcija"><div class="ad-sek-h">KREDITŲ ŽURNALAS</div><div id="ad-zurnalas">Kraunama…</div></div>';
    imti('/admin/zurnalas?userId=' + u.id).then(piestiZurnala)
      .catch(function (e) { document.getElementById('ad-zurnalas').innerHTML = tuscia('never', 'Nepavyko', e.message); });
  }

  // Trys busenos atpazistamos IS TURINIO, be naujo stulpelio (13 paketas, 6):
  //   kiekis === 0            -> NEMOKAMAI (24 h pakartojimas)
  //   veiksmas baigiasi -grazinta -> GRAZINTA
  //   veiksmas === 'planas'   -> PLANAS
  function zurnaloZenklas(x) {
    if (x.veiksmas === 'planas') return '<span class="chip">PLANAS</span>';
    if (/-grazinta$/.test(x.veiksmas || '')) return '<span class="chip ad-istaisyta">GRĄŽINTA</span>';
    if (x.kiekis === 0) return '<span class="chip">NEMOKAMAI</span>';
    return '';
  }

  function piestiZurnala(d) {
    var ir = (d && d.irasai) || [];
    var z = document.getElementById('ad-zurnalas');
    if (!z) return;
    if (!ir.length) { z.innerHTML = tuscia('never', 'Žurnalas tuščias', 'Kreditų judėjimo dar nebuvo.'); return; }
    z.innerHTML = '<div class="ct-table-w"><table class="ct-table is-dense"><thead><tr>'
      + '<th class="is-time">KADA</th><th>VEIKSMAS</th><th>OBJEKTAS</th>'
      + '<th class="is-num">KIEKIS</th><th class="is-num">LIKUTIS</th><th>PASTABA</th>'
      + '</tr></thead><tbody>'
      + ir.map(function (x) {
          return '<tr><td class="is-time" data-stulpelis="KADA">' + laikas(x.laikas) + '</td>'
            + '<td data-stulpelis="VEIKSMAS">' + esc(x.veiksmas || '—') + ' ' + zurnaloZenklas(x) + '</td>'
            + '<td class="is-id" data-stulpelis="OBJEKTAS">' + esc((x.raktas || '—')).slice(0, 60) + '</td>'
            + '<td class="is-num" data-stulpelis="KIEKIS">' + (x.kiekis > 0 ? '+' : '') + (x.kiekis != null ? x.kiekis : '—') + '</td>'
            + '<td class="is-num" data-stulpelis="LIKUTIS">' + (x.likutis_po != null ? x.likutis_po : '—') + '</td>'
            + '<td class="is-text" data-stulpelis="PASTABA"><span class="ct-clamp">' + esc(x.pastaba || '') + '</span></td></tr>';
        }).join('')
      + '</tbody></table></div>';
  }

  // Prie plano NERA „Issaugoti" mygtuko. nustatytiPlana() PERRASO kreditai_plano
  // i naujo plano menesio kieki (gali ir atimti) ir nuzeruoja paieskas - is
  // mygtuko to nesimato niekaip. Todel pasirinkus kita plana rodoma kortele su
  // poveikiu skaiciais, ir tik ji turi patvirtinima. Skaiciai imami is PLANAI,
  // t.y. IS TO PATIES SALTINIO, kuri naudos backend'as (13 paketas, 2).
  window.adPlanoPasirinkimas = function (k) {
    var u = _vartotojas, d = document.getElementById('ad-plano-poveikis');
    if (!u || !d) return;
    if (k === u.plan) { d.innerHTML = ''; return; }
    if (!_planai || !_planai[k]) { d.innerHTML = '<div class="ad-poveikis">Trūksta planų duomenų.</div>'; return; }
    var senas = u.plan, senasKr = u.kreditai_plano || 0, naujasKr = _planai[k].kreditaiMen;
    var eil = function (p, a, b, z) {
      return '<div class="ct-specs-e"><span class="ct-specs-k">' + p + '</span>'
        + '<span class="ct-specs-v">' + a + ' → ' + b + (z ? ' <span class="ad-nepakis">' + z + '</span>' : '') + '</span></div>';
    };
    d.innerHTML = '<div class="ad-poveikis">'
      + '<div class="ad-pov-h">KĄ tai padarys</div>'
      + '<div class="ct-specs">'
      +   eil('Planas', esc(planoVardas(senas)), esc(planoVardas(k)), '')
      +   eil('Plano kreditai', senasKr, naujasKr, naujasKr < senasKr ? '−' + (senasKr - naujasKr) : '')
      +   eil('Pirkti kreditai', (u.kreditai_pirkti || 0), (u.kreditai_pirkti || 0), 'nepakis')
      +   eil('Paieškos šį mėn.', (u.paieskos_menesi || 0), 0, '')
      +   eil('Paieškų riba', paieskuRiba(senas), paieskuRiba(k), '')
      +   eil('Mėnesio kaina', (_planai[senas] ? _planai[senas].kaina : '?') + ' €', _planai[k].kaina + ' €', '')
      + '</div>'
      + '<div class="ad-pov-v">'
      +   '<button type="button" class="ct-btn ct-btn-sm ct-btn-primary" onclick="adPlanoPatvirtinti(&quot;' + k + '&quot;)"><span>Patvirtinu</span></button>'
      +   '<button type="button" class="ct-btn ct-btn-sm" onclick="piestiVartotoja()"><span>Atšaukti</span></button>'
      +   '<span class="ad-irankiu-zinia" id="ad-pl-z"></span>'
      + '</div></div>';
  };

  window.adPlanoPatvirtinti = function (k) {
    var u = _vartotojas, z = document.getElementById('ad-pl-z');
    if (!u) return;
    if (z) z.textContent = 'Keičiama…';
    siusti('/admin/planas', { email: u.email, planas: k }).then(function () {
      return imti('/admin/vartotojai');
    }).then(function (d) {
      window._vartotojai = d.vartotojai || [];
      var n = window._vartotojai.filter(function (x) { return x.id === u.id; })[0];
      if (n) { _vartotojas = n; piestiVartotoja(); }
    }).catch(function (e) { if (z) z.textContent = 'Nepavyko: ' + e.message; });
  };

  window.adKredituPrideti = function () {
    var u = _vartotojas, z = document.getElementById('ad-kr-z');
    var kiekis = parseInt((document.getElementById('ad-kr-kiekis') || {}).value, 10);
    var past = (document.getElementById('ad-kr-pastaba') || {}).value || '';
    if (!u) return;
    if (!kiekis) { if (z) z.textContent = 'Kiek?'; return; }
    if (z) z.textContent = 'Siunčiama…';
    siusti('/admin/kreditai', { email: u.email, kiekis: kiekis, pastaba: past }).then(function () {
      return imti('/admin/vartotojai');
    }).then(function (d) {
      window._vartotojai = d.vartotojai || [];
      var n = window._vartotojai.filter(function (x) { return x.id === u.id; })[0];
      if (n) { _vartotojas = n; piestiVartotoja(); }
    }).catch(function (e) { if (z) z.textContent = 'Nepavyko: ' + e.message; });
  };

  document.getElementById('ad-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.ct-tab'); if (!b) return;
    [].forEach.call(this.children, function (x) { x.classList.toggle('active', x === b); });
    _rodyti = b.dataset.t;
    if (_rodyti === 'klaidos') piestiKlaidas();
    else if (_rodyti === 'matavimai') piestiMatavimus();
    else piestiVartotojus();
  });

  if (!zetonas()) {
    el.innerHTML = tuscia('never', 'Reikia prisijungti', 'Šis puslapis skirtas administratoriui.');
    sub.textContent = '';
  } else {
    piestiKlaidas();
  }

  // v1.78.0 (Nr. 22): busena, pakeista telefone, web'e likdavo sena, nes puslapis
  // duomenis pasiima tik atsidarydamas. Sarasas nera realaus laiko srautas, tad
  // nedarom apklausos kas N sekundziu - uztenka atsinaujinti tada, kai zmogus
  // GRIZTA i si skirtuka. Butent tas atvejis ir buvo aprasytas.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (!zetonas()) return;
    if (_rodyti !== 'klaidos') return;
    piestiKlaidas();
  });
})();
</script>
