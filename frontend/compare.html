<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palyginimo ataskaita — CarTriige</title>
<style>


/* ── blokas #0 ── */

  /* ===== DESIGN TOKENS (v1) ===== */
  :root {
    --bg-base:       #0a0c10;
    --bg-surface:    #141720;
    --bg-elevated:   #1c2030;
    --bg-card:       #16192a;
    --border:        #252a38;
    --border-light:  #2e3448;
    --accent:        #7c6ff7;
    --accent-hover:  #6c5ce7;
    --accent-light:  #a78bfa;
    --accent-dim:    rgba(124,111,247,0.12);
    --success:       #7fd88f;
    --danger:        #ff9d9d;
    --warning:       #f0c674;
    --text-primary:  #e8e8ea;
    --text-secondary:#b0b0c0;
    --text-muted:    #6e7080;
    --radius-sm:     6px;
    --radius-md:     10px;
    --radius-lg:     14px;
    --radius-xl:     20px;
    --font:          -apple-system, 'Segoe UI', Arial, sans-serif;
    --shadow-card:   0 2px 16px rgba(0,0,0,0.4);
    --shadow-glow:   0 0 20px rgba(124,111,247,0.25);
  }

  /* ===== RESET & BASE ===== */
  * { box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg-base);
    color: var(--text-primary);
    margin: 0;
    padding: 0;
  }
  .container { max-width: 1240px; margin: 0 auto; padding: 0 20px 40px; }

  /* ===== APP HEADER ===== */
  .app-header {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 800;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .app-header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .app-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    flex-shrink: 0;
  }
  .app-logo-mark {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .app-logo-name {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff 40%, var(--accent-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.3px;
  }
  #app-version {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 2px;
    letter-spacing: 0.5px;
    -webkit-text-fill-color: var(--text-muted);
  }
  .app-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: var(--radius-md);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .nav-btn:hover { background: var(--border); color: var(--text-primary); }
  .nav-btn.has-items { color: var(--warning); border-color: rgba(240,198,116,0.3); }
  .nav-badge {
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  /* ===== SEARCH HERO ===== */
  .search-hero {
    padding: 32px 0 8px;
  }
  .hero-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 0 0 6px;
    color: var(--text-primary);
  }
  .hero-subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.5;
  }

  /* ===== LEGACY COMPAT (subtitle class still used nowhere, kept for safety) ===== */
  .subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }

  /* ===== FORM FIELDS ===== */
  .filters { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .filters label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .filters input, .filters select { width: 100%; padding: 9px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-primary); font-size: 14px; transition: border-color 0.15s; }
  .filters input:focus, .filters select:focus { outline: none; border-color: var(--accent); }
  .full-row { grid-column: 1 / -1; }
  /* Search mode selector */
  .ct-mode-selector { display: flex; gap: 8px; margin-bottom: 14px; }
  .ct-mode-btn {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--bg-elevated); color: var(--text-secondary); font: 600 12px var(--font);
    cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 3px;
  }
  .ct-mode-btn:hover { border-color: var(--accent); color: var(--text-primary); }
  .ct-mode-btn.active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-light); }
  .ct-mode-btn b { font-size: 13px; display: block; }
  .ct-mode-btn span { font: 400 10px var(--font); color: var(--text-dim); line-height: 1.3; }
  .ct-mode-btn.active span { color: var(--text-muted); }
  .ct-mode-ic { font-size: 16px; margin-bottom: 2px; }
  @media (max-width: 600px) { .ct-mode-selector { flex-direction: column; } }
  button#search-btn { grid-column: 1 / -1; padding: 13px; background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: white; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; letter-spacing: 0.2px; box-shadow: 0 4px 14px rgba(124,111,247,0.35); transition: opacity 0.15s, transform 0.15s; }
  button#search-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  button#search-btn:disabled { background: var(--bg-elevated); color: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; }
  #status { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; min-height: 20px; }
  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; display: flex; gap: 16px; border-left: 4px solid var(--accent); position: relative; box-shadow: var(--shadow-card); }
  .fav-star { position: absolute; top: 10px; right: 10px; background: rgba(10,12,16,0.75); border: none; color: var(--text-muted); font-size: 20px; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; z-index: 2; }
  .fav-star.active { color: var(--warning); }
  .card img { width: 140px; height: 100px; object-fit: cover; border-radius: var(--radius-md); background: var(--bg-elevated); flex-shrink: 0; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-weight: 600; font-size: 16px; color: var(--text-primary); }
  .card-price { color: var(--accent-light); font-weight: 700; font-size: 17px; }
  .card-meta { color: var(--text-muted); font-size: 13px; margin: 4px 0; }
  .card-diff { display: inline-block; background: var(--bg-elevated); padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; margin-left: 8px; }
  .card-diff.high-risk { background: rgba(255,128,128,0.1); color: #ff8080; border: 1px solid rgba(255,128,128,0.25); }
  .risk-banner { background: rgba(255,100,100,0.08); border: 1px solid rgba(122,48,48,0.6); color: var(--danger); padding: 8px 10px; border-radius: var(--radius-sm); font-size: 12px; margin: 6px 0; }
  .card-signals { font-size: 12px; color: var(--success); margin: 6px 0; }
  .card-comment { font-size: 13px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
  .card-link { display: inline-block; margin-top: 8px; color: var(--accent-light); font-size: 13px; text-decoration: none; }
  .source-tag { font-size: 11px; padding: 1px 7px; border-radius: var(--radius-sm); background: var(--bg-elevated); color: var(--text-muted); margin-left: 6px; border: 1px solid var(--border); }
  #search-progress-wrap { display: none; margin: -8px 0 14px; }
  #search-progress-track-main { height: 3px; background: var(--bg-surface); border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
  #search-progress-fill-main { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); border-radius: 4px; transition: width 0.5s ease; width: 0%; }
  #search-progress-label { font-size: 12px; color: var(--accent-light); font-weight: 600; }
  #log-container { margin-bottom: 16px; display: none; }
  #log-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; color: var(--text-secondary); user-select: none; }
  #log-header:hover { background: var(--bg-elevated); }
  #log-header .chevron { margin-left: auto; transition: transform 0.2s; color: var(--text-muted); }
  #log-header.expanded .chevron { transform: rotate(180deg); }
  #log-box { background: var(--bg-base); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-md) var(--radius-md); padding: 4px; max-height: 260px; overflow-y: auto; display: none; }
  .log-step { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
  .log-step:last-child { border-bottom: none; }
  .log-step .spinner { width: 14px; height: 14px; border: 2px solid var(--border-light); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  .log-step .done-check { color: var(--success); flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .log-step.current { color: var(--text-primary); font-weight: 500; }
  .card-actions { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .detail-btn { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border); padding: 7px 13px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .detail-btn:hover { background: var(--border); color: var(--text-primary); }
  .detail-btn.ready { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #fff; font-weight: 600; border-color: transparent; box-shadow: 0 0 14px rgba(124,111,247,0.4); animation: pulse-glow 2.5s ease-in-out infinite; }
  @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 8px rgba(124,111,247,0.3); } 50% { box-shadow: 0 0 20px rgba(167,139,250,0.55); } }
  .detail-panel { margin-top: 12px; padding: 14px; background: var(--bg-base); border-radius: var(--radius-md); border-left: 3px solid var(--success); font-size: 13px; display: none; }
  .detail-panel h4 { margin: 10px 0 5px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; }
  .detail-panel ul { margin: 4px 0; padding-left: 18px; color: var(--text-secondary); }
  .detail-panel .verdict { color: var(--success); font-weight: 600; font-size: 14px; line-height: 1.5; }
  .photo-gallery { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
  .photo-gallery img { width: 76px; height: 58px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0; background: var(--bg-elevated); cursor: pointer; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.93); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
  #lightbox.active { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 76vh; object-fit: contain; border-radius: var(--radius-sm); }
  #lightbox-counter { color: var(--text-muted); font-size: 13px; margin-top: 10px; }
  #lightbox-close { position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,0.08); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.08); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; }
  #lightbox-prev { left: 12px; }
  #lightbox-next { right: 12px; }
  .card-photo-wrap { position: relative; flex-shrink: 0; line-height: 0; }
  .card-photo-wrap img { display: block; }
  .card-photo-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(10,12,16,0.7); color: #fff; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 15px; cursor: pointer; line-height: 1; padding: 0; }
  .card-photo-nav.prev { left: 4px; }
  .card-photo-nav.next { right: 4px; }
  .card-photo-count { position: absolute; bottom: 4px; right: 6px; background: rgba(10,12,16,0.75); color: var(--accent-light); font-size: 10px; padding: 1px 6px; border-radius: 10px; }

  /* ============ PALYGINIMAS ============ */
  .compare-toggle {
    background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: var(--radius-sm); font-size: 11px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .compare-toggle.active { background: rgba(74,144,217,0.15); color: #74c0fc; border-color: rgba(74,144,217,0.4); }
  #compare-bar {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-surface);
    border-top: 1px solid var(--border-light);
    padding: 12px 20px; z-index: 900;
    align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.6);
  }
  #compare-bar.visible { display: flex; }
  #compare-bar-items { display: flex; gap: 8px; flex: 1; overflow: hidden; }
  .compare-bar-chip {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px;
    font-size: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 6px;
    max-width: 160px; overflow: hidden;
  }
  .compare-bar-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compare-bar-chip button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 0; flex-shrink: 0; }
  #compare-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #fff;
    border: none; padding: 10px 20px; border-radius: var(--radius-md); font-size: 14px;
    font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(124,111,247,0.4);
  }
  #compare-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    z-index: 1500; overflow-y: auto; padding: 20px;
  }
  #compare-modal.active { display: block; }
  #compare-modal-inner {
    max-width: 960px; margin: 0 auto; background: var(--bg-surface);
    border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 20px; position: relative;
  }
  .compare-grid { display: grid; gap: 14px; }
  .compare-col {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; overflow: hidden;
  }
  .compare-col img { width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 10px; background: var(--bg-base); }
  .compare-col-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: var(--text-primary); }
  .compare-col-price { color: var(--accent-light); font-size: 18px; font-weight: 800; margin-bottom: 10px; }
  .compare-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .compare-row:last-child { border-bottom: none; }
  .compare-row-label { color: var(--text-muted); }
  .compare-row-val { color: var(--text-primary); font-weight: 500; text-align: right; max-width: 60%; }
  .compare-row-val.better { color: var(--success); }
  .compare-row-val.worse { color: var(--danger); }
  #compare-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border);
    width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  @media (max-width: 640px) {
    #compare-bar { padding: 10px 12px; }
    .compare-bar-chip { max-width: 100px; font-size: 11px; }
    #compare-btn { font-size: 13px; padding: 8px 14px; }
    #compare-modal { padding: 10px; }
    #compare-modal-inner { padding: 14px; }
    .compare-col img { height: 110px; }
    #compare-bar-items { gap: 4px; }
  }
  /* ============ MOBILUS ISDESTYMAS ============ */
  @media (max-width: 640px) {
    .container { padding: 0 12px 40px; }
    .search-hero { padding: 20px 0 4px; }
    .hero-title { font-size: 19px; }
    .hero-subtitle { font-size: 13px; margin-bottom: 16px; }
    .app-header-inner { height: 50px; }
    .app-logo-name { font-size: 16px; }
    .filters { grid-template-columns: 1fr; padding: 14px; gap: 10px; }
    .filters input, .filters select { padding: 11px; font-size: 16px; } /* 16px - apsaugo nuo iOS auto-zoom */
    button#search-btn { padding: 14px; font-size: 15px; }
    .card { flex-direction: column; padding: 12px; gap: 10px; }
    .card img { width: 100%; height: 180px; }
    .card-title { font-size: 15px; }
    .card-price { font-size: 16px; }
    .card-actions { flex-direction: column; align-items: stretch; gap: 8px; }
    .card-actions .card-link { padding: 10px; text-align: center; background: var(--bg-elevated); border-radius: var(--radius-sm); }
    .detail-btn { padding: 11px 12px; font-size: 13px; width: 100%; }
    #log-header { font-size: 12px; padding: 12px; }
    #sort-bar select { width: 100%; margin-top: 6px; }
    #sort-bar label { display: block; margin-bottom: 2px; }
    .risk-banner { font-size: 11px; }
    #all-listings-wrap button { font-size: 13px; padding: 12px; }
    #all-listings > div > div:not(.detail-panel) { flex-direction: column !important; align-items: stretch !important; }
    #all-listings img { width: 100% !important; height: 140px !important; }
    #all-listings .detail-btn { width: 100%; margin-top: 6px; }
  }

  /* ============ TINDER NARSYMAS (visi ekranai) ============ */
  #tinder-launch-btn { display: inline-flex; align-items: center; gap: 6px; }
  #tinder-view {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg-base);
    z-index: 1000;
    flex-direction: column; align-items: center;
  }
  #tinder-view.active { display: flex; }
  #tinder-topbar {
    width: 100%; max-width: 480px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px 10px;
    flex-shrink: 0;
  }
  #tinder-counter { font-size: 12px; color: var(--text-muted); }
  #tinder-close {
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary);
    width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  #tinder-progress-track { flex: 1; margin: 0 12px; height: 3px; background: var(--border); border-radius: 4px; overflow: hidden; }
  #tinder-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); border-radius: 4px; transition: width 0.3s; }
  #tinder-stack {
    position: relative; width: 100%; max-width: 480px;
    flex: 1; padding: 0 12px 8px;
    display: flex; align-items: stretch; justify-content: center; overflow: hidden;
  }
  .tinder-card {
    position: absolute; width: calc(100% - 24px); max-width: 456px;
    top: 0; bottom: 0;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl); overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    cursor: grab; user-select: none; touch-action: none;
    display: flex; flex-direction: column;
  }
  .tinder-photo-wrap { position: relative; flex-shrink: 0; height: 52%; overflow: hidden; transition: height 0.3s ease; }
  .tinder-photo-wrap.shrunk { height: 22%; }
  .tinder-photo-wrap img { width: 100%; height: 100%; object-fit: cover; background: var(--bg-elevated); display: block; }
  .tinder-photo-gradient {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60%;
    background: linear-gradient(to top, rgba(10,12,16,0.96) 0%, rgba(10,12,16,0.5) 50%, transparent 100%);
    pointer-events: none;
  }
  .tinder-photo-info {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 16px 12px;
    pointer-events: none;
  }
  .tinder-card-title { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2; }
  .tinder-card-price { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .tinder-price-val { color: var(--accent-light); font-size: 22px; font-weight: 800; }
  .tinder-price-diff {
    background: var(--accent-dim); border: 1px solid rgba(124,111,247,0.5);
    color: var(--accent-light); font-size: 12px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
  }
  .tinder-card-body { padding: 12px 16px 10px; overflow-y: auto; flex: 1; min-height: 0; }
  .tinder-card-meta { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; line-height: 1.5; }
  .tinder-card-comment { font-size: 13px; color: var(--text-secondary); line-height: 1.45; margin-bottom: 8px; }
  .tinder-card-signals { font-size: 12px; color: var(--success); margin-bottom: 8px; }
  .tinder-detail-btn {
    background: var(--bg-elevated); color: var(--accent-light); border: 1px solid var(--border-light);
    padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tinder-badge {
    position: absolute; top: 20px; font-size: 22px; font-weight: 800;
    padding: 5px 14px; border-radius: 8px; border: 3px solid;
    opacity: 0; pointer-events: none; z-index: 5; letter-spacing: 1px;
  }
  .tinder-badge.like { right: 16px; color: var(--success); border-color: var(--success); transform: rotate(-12deg); }
  .tinder-badge.skip { left: 16px; color: var(--danger); border-color: var(--danger); transform: rotate(12deg); }
  #tinder-actions {
    width: 100%; max-width: 480px; padding: 12px 16px 20px;
    display: flex; justify-content: center; gap: 24px; align-items: center; flex-shrink: 0;
  }
  .tinder-btn-skip {
    width: 62px; height: 62px; border-radius: 50%; border: 2px solid var(--danger);
    background: rgba(255,157,157,0.08); color: var(--danger);
    font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .tinder-btn-skip:active { background: rgba(255,157,157,0.2); transform: scale(0.92); }
  .tinder-btn-like {
    width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--success);
    background: rgba(127,216,143,0.08); color: var(--success);
    font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .tinder-btn-like:active { background: rgba(127,216,143,0.2); transform: scale(0.92); }
  .tinder-btn-info {
    width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--accent);
    background: var(--accent-dim); color: var(--accent-light);
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .tinder-btn-info:active { background: rgba(124,111,247,0.25); transform: scale(0.92); }
  #tinder-hint { color: var(--text-muted); font-size: 11px; padding: 0 16px 6px; text-align: center; flex-shrink: 0; }

  /* ===== SORT BAR ===== */
  #sort-bar { display: none; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; align-items: center; }
  #sort-select { padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); font-size: 13px; }

  /* ===== ALL LISTINGS ===== */
  #all-listings-wrap { margin-top: 30px; }
  #toggle-all-btn { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 16px; border-radius: var(--radius-md); cursor: pointer; width: 100%; text-align: left; font-size: 13px; transition: all 0.15s; }
  #toggle-all-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
  #all-listings { margin-top: 8px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }

  /* ===== TOAST NOTIFICATIONS ===== */
  #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
  .toast {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border-light); color: var(--text-primary);
    padding: 12px 16px; border-radius: 10px; font-size: 13px; line-height: 1.4;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6); max-width: 320px;
    pointer-events: all; cursor: pointer;
    animation: toast-in 0.25s cubic-bezier(.34,1.56,.64,1);
    transition: opacity 0.35s, transform 0.35s;
  }
  .toast::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 3px; background: var(--text-muted); }
  .toast.error { border-color: var(--danger-border); background: rgba(30,12,12,.98); color: #ff9999; }
  .toast.error::before { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .toast.warning { border-color: var(--warning-border); color: var(--warning); }
  .toast.warning::before { background: var(--warning); }
  .toast.success { border-color: var(--success-border); color: var(--success); }
  .toast.success::before { background: var(--success); }
  .toast-close { flex: none; margin-left: auto; padding-left: 8px; color: var(--text-muted); font-size: 16px; line-height: 1; cursor: pointer; }
  .toast-close:hover { color: var(--text-primary); }
  @keyframes toast-in { from { opacity: 0; transform: translateX(24px) scale(.95); } to { opacity: 1; transform: translateX(0) scale(1); } }

/* ── Auth modal overlay ── */
#ct-auth-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5, 7, 12, 0.84);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: ct-fade-in .18s ease;
}
#ct-auth-overlay.ct-open { display: flex; }

@keyframes ct-fade-in  { from { opacity: 0; } to { opacity: 1; } }
@keyframes ct-slide-up { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.ct-auth-card {

.ct-auth-close {

.ct-auth-close:hover { background: rgba(255,255,255,.1); color: #E9EBF2; }
.ct-auth-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,.075); }
.ct-auth-tab {
  flex: 1; height: 48px; background: transparent; border: none;
  font: 500 14px 'Archivo', -apple-system, Helvetica, sans-serif;
  color: #8C93A6; cursor: pointer;

  transition: color .14s, border-color .14s;
}
.ct-auth-tab:hover { color: #E9EBF2; }
.ct-auth-tab.ct-active { color: #E9EBF2; border-bottom-color: #7C5CFF; font-weight: 600; }
.ct-auth-body { padding: 26px 28px 24px; }
.ct-auth-logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 22px; }
.ct-auth-logo svg { width: 32px; height: 32px; flex: none; }
.ct-auth-logo-text { font: 400 20px 'Archivo',-apple-system,Helvetica,sans-serif; color: #E9EBF2; letter-spacing: -.01em; }
.ct-auth-logo-text b { font-weight: 700; color: #A78BFA; }
.ct-auth-msg {
  display: none; padding: 10px 12px; border-radius: 9px;
  font: 500 13px/1.45 'Archivo',-apple-system,Helvetica,sans-serif; margin-bottom: 14px;
}
.ct-auth-msg.ct-err { display: block; background: rgba(239,83,80,.13); border: 1px solid rgba(239,83,80,.35); color: #ef5350; }
.ct-auth-msg.ct-ok  { display: block; background: rgba(102,187,106,.13); border: 1px solid rgba(102,187,106,.35); color: #66bb6a; }
.ct-auth-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 13px; }
.ct-auth-field label { font: 700 9px/1 'IBM Plex Mono', ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #5E6578; }
.ct-auth-wrap { position: relative; display: flex; align-items: center; }
.ct-auth-input {
  width: 100%; height: 46px; padding: 0 40px 0 14px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px; color: #E9EBF2;
  font: 500 14px 'Archivo',-apple-system,Helvetica,sans-serif;
  outline: none; transition: border-color .15s, background .15s;
}
.ct-auth-input::placeholder { color: #5E6578; }
.ct-auth-input:focus { border-color: rgba(124,92,255,.45); background: rgba(124,92,255,.06); }
.ct-auth-icon { position: absolute; right: 12px; color: #5E6578; pointer-events: none; }
.ct-auth-eye {
  position: absolute; right: 10px; background: transparent; border: none;
  color: #8C93A6; cursor: pointer; padding: 4px; display: grid; place-items: center; font-family: inherit;
}
.ct-auth-eye:hover { color: #E9EBF2; }
.ct-auth-invite-badge {
  display: inline-flex; align-items: center; gap: 5px; margin-bottom: 16px;
  font: 600 10px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .1em;
  padding: 5px 9px; border-radius: 6px;
  background: rgba(124,92,255,.15); border: 1px solid rgba(124,92,255,.3); color: #A78BFA;
}
.ct-auth-submit {
  width: 100%; height: 46px; border-radius: 10px; border: none;

}
.ct-auth-submit::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,.08), transparent); pointer-events: none; }
.ct-auth-submit:hover { filter: brightness(1.1); }

.ct-auth-submit .ct-spin { display: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; animation: ct-spin .7s linear infinite; margin: 0 auto; }

/* ============================================================
   CarTriige design tokens — v2 (from CarTriige.dc.html)
   Drop-in replacement for the :root block in frontend/index.html.
   Existing variable names are KEPT (JS/HTML untouched); new ones added.
   ============================================================ */
:root {
  /* Surfaces — navy/charcoal, four elevation steps */
  --bg-base:        #0A0C12;
  --bg-surface:     #11141C;
  --bg-elevated:    #171B25;
  --bg-card:        #11141C;
  --bg-raised:      #1F2431;            /* new: hover / active / tick tracks */

  /* Hairlines */
  --border:         rgba(255,255,255,.075);
  --border-light:   rgba(255,255,255,.14);

  /* Accent — used sparingly: logo mark, primary CTA, active tab, "this car" marker */
  --accent:         #7C5CFF;
  --accent-hover:   #8B6FFF;
  --accent-light:   #A78BFA;
  --accent-dim:     rgba(124,92,255,.14);
  --accent-border:  rgba(124,92,255,.30);

  /* Semantic — opportunity / warning / risk */
  --success:        oklch(.75 .15 158);
  --success-dim:    oklch(.75 .15 158 / .13);
  --success-border: oklch(.75 .15 158 / .30);
  --warning:        oklch(.81 .13 78);
  --warning-dim:    oklch(.81 .13 78 / .13);
  --warning-border: oklch(.81 .13 78 / .30);
  --danger:         oklch(.66 .19 25);
  --danger-dim:     oklch(.66 .19 25 / .13);
  --danger-border:  oklch(.66 .19 25 / .30);

  /* Type colour ramp */
  --text-primary:   #E9EBF2;
  --text-secondary: #C3C9D8;
  --text-muted:     #8C93A6;
  --text-dim:       #5E6578;            /* new: mono eyebrow labels */

  /* Radii — tighter than v1 */
  --radius-sm:      6px;
  --radius-md:      7px;
  --radius-lg:      11px;
  --radius-xl:      12px;

  /* Typography — UI sans + data mono */
  --font:           'Archivo', -apple-system, 'Segoe UI', Helvetica, sans-serif;
  --font-mono:      'IBM Plex Mono', ui-monospace, Menlo, monospace;

  /* Shadows — restrained */
  --shadow-card:    0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-panel:   0 18px 40px -24px rgba(0,0,0,.8);
  --shadow-glow:    0 8px 22px -12px rgba(124,92,255,.9);
}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
*/

/* Eyebrow label pattern used everywhere: */
.eyebrow { font: 500 9px/1 var(--font-mono); letter-spacing: .12em; color: var(--text-dim); text-transform: uppercase; }
.mono    { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ============================================================
   CarTriige Hero v3 — pagal dizaino referensą
   ============================================================ */

/* ---- HEADER ---- */
.ct3-header {
  position: relative; z-index: 100;
  background: transparent;
  border-bottom: none;
}
.ct3-header-inner {
  display: flex; align-items: center; gap: 0;
  max-width: 1440px; margin: 0 auto;
  padding: 22px 48px;
}
.ct3-logo {
  display: flex; align-items: center; gap: 14px;
  text-decoration: none; flex: none;
}
.ct3-logo-icon { width: 52px; height: 52px; flex: none; }
.ct3-logo-text > span { font-size: 28px; font-weight: 400; color: var(--text-primary); letter-spacing: -.01em; line-height: 1; }
.ct3-logo-text > span b { font-weight: 700; color: var(--accent-light); }
.ct3-logo-text small { font: 600 9px/1 var(--font-mono); letter-spacing: .15em; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }
.ct3-nav { display: flex; gap: 4px; margin-left: 56px; flex: 1; }
.ct3-nav-link {
  padding: 10px 20px; border-radius: 8px; font-size: 15px; font-weight: 500;
  color: var(--text-secondary); text-decoration: none; transition: color .15s, background .15s;
}
.ct3-nav-link:hover { color: var(--text-primary); background: rgba(255,255,255,.05); }
.ct3-nav-link.active { color: var(--text-primary); }
.ct3-premium-btn {
  display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 22px;
  border-radius: 21px; border: 1px solid var(--accent); background: transparent;
  color: var(--accent-light); font: 600 15px var(--font); cursor: pointer;
  transition: background .15s;
}
.ct3-avatar {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border-light);
  background: var(--bg-elevated); color: var(--text-secondary); display: grid; place-items: center; cursor: pointer;
}
.ct3-header-right { display: flex; align-items: center; gap: 10px; flex: none; }
.ct3-logo-text { display: flex; flex-direction: column; gap: 1px; }
.ct3-premium-btn:hover { background: var(--accent-dim); }

/* ---- HERO ---- */
.ct3-hero {
  position: relative; min-height: 620px;
  background: var(--bg-base);
  overflow: visible;
  margin-top: -96px;
}
.ct3-hero-photo {
  position: absolute; top: 0; left: 0; right: 0; height: 600px;
  background: url('../assets/hero-car.png') 40% 55% / cover no-repeat;
  overflow: hidden;
}
.ct3-hero-photo-placeholder { display: none; }
/* Gradient overlay: dark left, transparent center-right */
.ct3-hero-overlay {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(
    105deg,
    rgba(10,12,18,.96) 0%,
    rgba(10,12,18,.78) 30%,
    rgba(10,12,18,.4) 60%,
    rgba(10,12,18,.65) 100%
  );
}
/* Bottom fade into search panel */
.ct3-hero::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
  background: linear-gradient(to bottom, transparent, rgba(10,12,18,.9));
  pointer-events: none;
}
.ct3-hero-content {
  position: relative; z-index: 10;
  display: flex; align-items: flex-end; justify-content: space-between;
  max-width: 1440px; margin: 0 auto;
  padding: 140px 48px 36px;
  min-height: 600px;
}
.ct3-hero-left { max-width: 540px; }
.ct3-hero-eyebrow {
  font: 600 10px/1 var(--font-mono); letter-spacing: .18em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 18px;
}
.ct3-hero-title {
  margin: 0 0 18px; font-size: 52px; font-weight: 700; line-height: 1.08;
  letter-spacing: -.03em; color: var(--text-primary);
  text-wrap: balance;
}
.ct3-hero-title em { font-style: normal; color: var(--accent-light); }
.ct3-hero-sub {
  margin: 0 0 28px; font-size: 15px; line-height: 1.6;
  color: var(--text-secondary); max-width: 440px; text-wrap: pretty;
}
.ct3-hero-feats { display: flex; gap: 28px; flex-wrap: wrap; }
.ct3-feat { display: flex; align-items: flex-start; gap: 10px; color: var(--text-secondary); }
.ct3-feat svg { flex: none; margin-top: 2px; color: var(--accent-light); }
.ct3-feat span { font-size: 13px; line-height: 1.4; }

/* right side */
.ct3-hero-right-stats {
  display: flex; flex-direction: column; align-items: flex-end; gap: 32px;

  position: absolute; right: 0; bottom: 36px;

  padding-right: 48px;

}
.ct3-hero-taglines { display: flex; flex-direction: column; gap: 4px; }
.ct3-hero-taglines > div {

  color: rgba(255,255,255,.3);
}
.ct3-hero-taglines .ct3-hl { color: var(--text-secondary); }
.ct3-hl-line { width: 40px; height: 2px; background: var(--accent); margin-top: 6px; margin-left: auto; border-radius: 1px; }
.ct3-car-watermark {
  display: flex; align-items: center; gap: 6px;

.ct3-car-model { font: 700 20px/1 var(--font-mono); letter-spacing: .04em; color: var(--text-primary); margin-bottom: 8px; }
.ct3-car-attrs { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
.ct3-car-attrs span { font: 600 9px/1 var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.25); }

/* ---- SEARCH PANEL ---- */
.ct3-search-panel {
  position: relative; z-index: 20;
  background: rgba(14,17,26,.97);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.1);

  margin: -4px 0 0;
  box-shadow: 0 24px 64px rgba(0,0,0,.7);
}
.ct3-search-inner { max-width: 1440px; margin: 0 auto; padding: 0 48px; }

/* tabs row */
.ct3-search-top {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.06); padding: 0 12px;
}
.ct3-search-tabs { display: flex; gap: 0; }
.ct3-stab {
  height: 48px; padding: 0 20px; background: transparent; border: none;
  font: 500 14px var(--font); color: var(--text-muted); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  transition: color .15s;
}
.ct3-stab:hover { color: var(--text-primary); }
.ct3-stab.active { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
.ct3-portals-row { display: flex; align-items: center; gap: 10px; }
.ct3-portal-row { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--text-secondary); transition:background .12s; }
.ct3-portal-row:hover { background:rgba(255,255,255,.06); }
.ct3-portal-row input[type=checkbox] { accent-color:var(--accent); width:14px; height:14px; flex:none; cursor:pointer; }
.ct3-portal-badge { font:700 10px/1 var(--font-mono); padding:3px 7px; border-radius:4px; border:1px solid; flex:none; }
.ct3-portal-name { flex:1; font:500 13px var(--font); }
.ct3-portal-flag { font-size:15px; flex:none; }
.ct3-hist-chip { background:var(--bg-elevated); color:var(--accent-light); border:1px solid var(--border-light); padding:6px 14px; border-radius:16px; font-size:12px; cursor:pointer; transition:all .15s; }
.ct3-hist-chip:hover { border-color:var(--accent); color:var(--accent); }
.ct3-portals-label { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; color: var(--text-dim); }
.ct3-flags { display: flex; align-items: center; gap: 4px; }
.ct3-flags span { font-size: 18px; line-height: 1; cursor: default; opacity: .9; }
.ct3-flags-more { font: 600 10px/1 var(--font-mono) !important; color: var(--text-muted) !important; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; font-size: 10px !important; }

/* fields */
.ct3-fields {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px; padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.ct3-field {
  display: flex; flex-direction: column; gap: 7px;
  padding: 10px 14px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 10px;
}
.ct3-field label { font: 700 9px/1 var(--font-mono); letter-spacing: .15em; color: var(--text-dim); }
.ct3-select-wrap {
  position: relative; display: flex; align-items: center;
  height: 36px; padding: 0 28px 0 0;
  background: transparent; border: none;
  border-radius: 0;
}
.ct3-select-wrap select {
  width: 100%; height: 100%; padding: 0;
  background: transparent; border: none; outline: none;
  font: 500 15px var(--font); color: var(--text-primary);
  cursor: pointer; -webkit-appearance: none;
}
.ct3-select-wrap select option { background: #1a1f2e; color: var(--text-primary); }
.ct3-arrow { position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; flex: none; }
.ct3-range-wrap {
  display: flex; align-items: center; gap: 0;
  height: 36px; padding: 0;
  background: transparent; border: none;
  position: relative;
}
.ct3-range-wrap input {
  flex: 1; min-width: 0; height: 100%; padding: 0;
  background: transparent; border: none; outline: none;
  font: 500 15px var(--font); color: var(--text-primary);
}
.ct3-range-wrap input::placeholder { color: var(--text-dim); }
.ct3-range-wrap span { color: var(--text-muted); font-size: 14px; flex: none; padding: 0 6px; }
.ct3-range-arrow { position: absolute; right: -8px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

/* bottom row */
.ct3-search-bottom {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 12px; gap: 12px;
}
.ct3-search-bottom-left { display: flex; align-items: center; gap: 10px; }
.ct3-search-bottom-right { display: flex; align-items: center; gap: 10px; }
.ct3-more-btn, .ct3-marketplaces-btn {
  display: flex; align-items: center; gap: 7px;
  height: 40px; padding: 0 16px; border-radius: 8px;
  border: 1px solid var(--border-light); background: transparent;
  color: var(--text-secondary); font: 500 13px var(--font); cursor: pointer;
  transition: background .15s;
}
.ct3-more-btn:hover, .ct3-marketplaces-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.ct3-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 9px;
  background: var(--accent); color: #fff; font: 700 9px var(--font-mono);
}
.ct3-save-btn {
  display: flex; align-items: center; gap: 7px;
  height: 44px; padding: 0 20px; border-radius: 10px;
  border: 1px solid var(--border-light); background: transparent;
  color: var(--text-secondary); font: 500 14px var(--font); cursor: pointer;
  transition: background .15s;
}
.ct3-save-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.ct3-search-btn {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 24px; border-radius: 10px;
  border: none; background: var(--accent);
  color: #fff; font: 600 15px var(--font); cursor: pointer;
  transition: filter .15s;
}
.ct3-search-btn:hover { filter: brightness(1.1); }

/* ---- STATS BAR ---- */
.ct3-stats-bar {
  background: rgba(13,16,26,.98);
  border-bottom: 1px solid rgba(255,255,255,.05);
  margin: 8px 48px 0;
  border-radius: 0 0 16px 16px;
  border: 1px solid rgba(255,255,255,.07);
  border-top: none;
}
.ct3-stats-inner {
  max-width: 1440px; margin: 0 auto; padding: 16px 24px;
  display: flex; align-items: center; gap: 0;
}
.ct3-stat-item { display: flex; align-items: center; gap: 12px; flex: 1; }
.ct3-stat-item svg { color: var(--accent-light); flex: none; }
.ct3-stat-item b { display: block; font: 600 15px var(--font); color: var(--text-primary); line-height: 1.2; white-space: nowrap; }
.ct3-stat-item span { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
.ct3-stat-div { width: 1px; height: 32px; background: rgba(255,255,255,.07); margin: 0 24px; flex: none; }
.ct3-stats-driven {
  margin-left: auto; flex: none; padding-left: 24px;
  border-left: 1px solid rgba(255,255,255,.07);
  font: 500 10px/1 var(--font-mono); letter-spacing: .2em;
  text-transform: uppercase; color: var(--text-dim);
}
.ct3-stats-driven b { color: var(--accent-light); font-weight: 700; }

/* ---- RESPONSIVE ---- */
@media (max-width: 1100px) {
  .ct3-fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ct3-hero-title { font-size: 40px; }
  .ct3-hero-right-stats { display: none; }
}
@media (max-width: 768px) {
  .ct3-header-inner { padding: 14px 20px; }
  .ct3-logo-icon { width: 38px; height: 38px; }
  .ct3-logo-text > span { font-size: 22px; }
  .ct3-nav { display: none; }
  .ct3-search-panel { margin: -16px 12px 0; border-radius: 14px; }
  .ct3-stats-bar { margin: 8px 12px 0; border-radius: 0 0 12px 12px; }
  .ct3-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ct3-hero-content { padding: 110px 20px 40px; }
  .ct3-hero-title { font-size: 32px; }
  .ct3-hero-sub { font-size: 14px; }
  .ct3-search-bottom { flex-direction: column; align-items: stretch; }
  .ct3-search-bottom-left, .ct3-search-bottom-right { justify-content: space-between; }
  .ct3-save-btn { flex: 1; justify-content: center; }
  .ct3-stats-inner { gap: 16px; flex-wrap: wrap; padding: 14px 16px; }
  .ct3-stat-div { display: none; }
  .ct3-stats-driven { margin-left: 0; border-left: none; padding-left: 0; }
}
@media (max-width: 480px) {
  .ct3-fields { grid-template-columns: 1fr 1fr; }
  .ct3-hero-title { font-size: 26px; }
  .ct3-hero-feats { gap: 16px; }
  .ct3-portals-row { display: none; }
  .ct3-search-tabs { overflow-x: auto; }
  .ct3-stab { font-size: 12px; padding: 0 12px; }
}

.card {

}

.card img, .card-photo-wrap img { width: 216px; height: 158px; border-radius: 0; object-fit: cover; }
.card-photo-count { background: rgba(10,12,18,.82); border: 1px solid var(--border-light); color: var(--text-muted); font: 600 9.5px/1 var(--font-mono); padding: 4px 6px; border-radius: 3px; bottom: 8px; right: 8px; }
.card-photo-nav { background: rgba(10,12,18,.75); border: 1px solid var(--border-light); width: 24px; height: 24px; }
.card-body { padding: 14px 18px 14px; }
.fav-star { top: 12px; right: 12px; width: 34px; height: 34px; border-radius: var(--radius-md); background: transparent; border: 1px solid var(--border-light); color: var(--text-muted); font-size: 14px; line-height: 1; display: grid; place-items: center; padding: 0; }

.fav-star.active { color: var(--warning); background: var(--warning-dim); border-color: var(--warning-border); }

.card-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding-right: 44px; }

.card-title > span[style] { font: 600 9px/1 var(--font-mono) !important; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; background: var(--success-dim) !important; color: var(--success) !important; border: 1px solid var(--success-border); border-radius: 3px !important; padding: 4px 6px !important; margin-left: 0 !important; }

.card-price { font: 600 25px/1 var(--font-mono); letter-spacing: -.02em; color: var(--text-primary); margin-top: 10px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-diff { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; font: 600 13px/1 var(--font-mono); background: transparent; color: var(--success); border: 1px solid var(--success-border); border-radius: 4px; padding: 6px 8px; margin-left: 0; }
.card-diff::after { content: "žemiau rinkos"; font: 400 11px/1 var(--font); color: var(--text-muted); }
.card-diff.high-risk { color: var(--danger); border-color: var(--danger-border); background: var(--danger-dim); }
.card-diff.high-risk::after { content: "tikrinti"; }

.card-meta { font: 500 12px/1.6 var(--font-mono); color: var(--text-muted); margin: 10px 0 0; font-variant-numeric: tabular-nums; }
.card-body > div[style*="color:#666"] { color: var(--text-dim) !important; font-family: var(--font-mono); font-size: 10.5px !important; }
.risk-banner { background: var(--danger-dim); border: 1px solid var(--danger-border); color: var(--danger); border-radius: var(--radius-sm); font-size: 12px; padding: 8px 10px; margin: 10px 0 0; }
.card-signals { font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .04em; color: var(--success); margin: 10px 0 0; display: inline-block; width: auto; max-width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; }
.card-comment { font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); margin-top: 10px; padding-left: 26px; position: relative; text-wrap: pretty; }
.card-comment::before { content: "AI"; position: absolute; left: 0; top: 2px; font: 600 9px/1.6 var(--font-mono); letter-spacing: .1em; color: var(--accent); }

.card-actions { margin-top: 12px; gap: 6px; }
.card-link { margin-top: 0; font-size: 12.5px; font-weight: 500; color: var(--text-muted); height: 34px; display: inline-flex; align-items: center; white-space: nowrap; padding: 0 12px; border: 1px solid var(--border-light); border-radius: var(--radius-md); }
.card-link:hover { color: var(--text-primary); background: var(--bg-elevated); }
.detail-btn { height: 34px; padding: 0 14px; white-space: nowrap; display: inline-flex; align-items: center; background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); border-radius: var(--radius-md); font-size: 12.5px; font-weight: 600; }
.detail-btn:hover { background: var(--bg-elevated); }

.compare-toggle { height: 34px; padding: 0 12px; display: inline-flex; align-items: center; white-space: nowrap; background: transparent; border: 1px solid var(--border-light); color: var(--text-muted); border-radius: var(--radius-md); font-size: 12px; font-weight: 500; }
.compare-toggle.active { background: var(--accent-dim); color: var(--text-primary); border-color: var(--accent); }

/* ===== DETAIL PANEL ===== */
.detail-panel { margin: 14px -18px -14px; padding: 18px; background: var(--bg-base); border-top: 1px solid var(--border); border-left: none; border-radius: 0; font-size: 13px; }
.detail-panel .verdict { color: var(--text-primary); font-weight: 500; font-size: 13.5px; line-height: 1.6; padding: 14px 16px; background: var(--bg-surface); border: 1px solid var(--accent-border); border-radius: var(--radius-lg); text-wrap: pretty; }
.detail-panel .verdict::before { content: "AI TRIAGE VERDICT"; display: block; font: 600 9px/1 var(--font-mono); letter-spacing: .13em; color: var(--accent); margin-bottom: 9px; }
.detail-panel h4 { margin: 20px 0 8px; font: 500 9px/1 var(--font-mono); letter-spacing: .13em; color: var(--text-dim); }

.detail-panel li { padding: 10px 12px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-secondary); font-size: 12.5px; line-height: 1.5; }
.detail-panel h4 + ul li { border-left: 2px solid var(--border-light); }

.detail-panel h4:nth-of-type(1) + ul li { border-left-color: var(--success); }
.detail-panel h4:nth-of-type(2) + ul li { border-left-color: var(--danger); }
.detail-panel h4:nth-of-type(3) + ul li { border-left-color: var(--warning); }

.detail-panel code { font: 600 12.5px var(--font-mono); letter-spacing: .05em; }
.detail-panel button[style] { background: transparent !important; color: var(--text-primary) !important; border: 1px solid var(--border-light) !important; border-radius: var(--radius-sm) !important; height: 26px; padding: 0 9px !important; font-size: 11px !important; white-space: nowrap; display: inline-flex; align-items: center; vertical-align: middle; }
.detail-panel button[style]:hover { background: var(--bg-elevated) !important; }
.detail-panel > div[style*="background:#1a1d24"] { background: var(--bg-surface) !important; border: 1px solid var(--success-border) !important; border-radius: var(--radius-lg) !important; padding: 14px 16px !important; }
.detail-panel > div[style*="background:#2a1a1a"] { background: var(--danger-dim) !important; border: 1px solid var(--danger-border) !important; border-radius: var(--radius-lg) !important; }

.photo-gallery { margin-top: 16px; gap: 8px; }
.photo-gallery img { width: 96px; height: 68px; border-radius: var(--radius-sm); border: 1px solid var(--border); }

/* ===== ALL LISTINGS ===== */
#toggle-all-btn { background: var(--bg-surface); border: 1px dashed var(--border-light); border-radius: var(--radius-lg); padding: 14px 18px; font-size: 13px; color: var(--text-muted); }

.compare-row-val.better { color: var(--success); } .compare-row-val.worse { color: var(--danger); }

/* ===== TOAST ===== */
/* toast styles unified above */

#favorites-panel { border-radius: var(--radius-lg) !important; }
#favorites-panel > button { background: transparent !important; border: 1px solid var(--border-light) !important; border-radius: var(--radius-md) !important; color: var(--text-primary) !important; height: 32px; padding: 0 12px !important; }

/* ===== MOBILE ===== */
@media (max-width: 640px) {
  .card { flex-direction: column; }
  .card img, .card-photo-wrap img { width: 100%; height: 180px; min-height: 0; }

.ct-main { padding: 16px 18px 14px; min-width: 0; }
.ct-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ct-title-row h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.ct-card .source-tag { font: 600 9px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border); margin: 0; }
.ct-card .fav-star.ct-fav { position: static; margin-left: auto; width: 32px; height: 32px; border-radius: 8px; background: transparent; border: 1px solid var(--border-light); color: var(--text-muted); font-size: 14px; display: grid; place-items: center; padding: 0; }
.ct-card .fav-star.ct-fav.active { color: var(--warning); background: var(--warning-dim); border-color: var(--warning-border); }
.ct-price-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.ct-price { font: 600 26px/1 var(--font-mono); letter-spacing: -.02em; color: var(--accent-light); }
.ct-diff { font: 700 12px/1 var(--font-mono); padding: 6px 8px; border-radius: 6px; }
.ct-market { font-size: 12.5px; color: var(--text-muted); }
.ct-market b { color: var(--text-primary); font-weight: 600; }
.ct-market small { color: var(--text-dim); }
.ct-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; overflow: visible; }
.ct-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; background: var(--bg-elevated); border: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.ct-chip i { font-style: normal; color: var(--text-dim); font-size: 11px; }
.ct-chip-pos { color: var(--success); border-color: var(--success-border); background: var(--success-dim); }
.ct-note { margin-top: 8px; padding: 8px 10px; border-radius: 7px; font-size: 12px; line-height: 1.45; color: var(--text-muted); background: var(--bg-elevated); border: 1px solid var(--border); }
.ct-note.ct-neg { background: var(--danger-dim); border-color: var(--danger-border); }
.ct-note.ct-warn { background: var(--warning-dim); border-color: var(--warning-border); }
.ct-note.ct-pos { background: var(--success-dim); border-color: var(--success-border); }
.ct-comment { display: flex; gap: 8px; margin-top: 12px; }
.ct-comment span { flex: none; font: 700 9px/1 var(--font-mono); padding: 5px 5px; border-radius: 4px; background: var(--accent); color: #fff; height: 18px; display: grid; place-items: center; }
.ct-comment p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); text-wrap: pretty; }
.ct-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.ct-btn, .ct-card .compare-toggle.ct-btn, .ct-card .detail-btn.ct-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); font-size: 12.5px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .15s; }
.ct-btn:hover, .ct-card .compare-toggle.ct-btn:hover, .ct-card .detail-btn.ct-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.ct-card .compare-toggle.ct-btn.active { background: var(--accent-dim); border-color: var(--accent); }
.ct-card .detail-btn.ct-btn-primary, .ct-card .detail-btn.ct-btn-primary.ready { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: none; animation: none; }
.ct-card .detail-btn.ct-btn-primary:hover { filter: brightness(1.08); }
.ct-card .detail-btn:disabled { opacity: .6; cursor: progress; }

/* score */
.ct-score { padding: 12px 0 0 0; border-top: 1px solid var(--border); margin-top: 12px; }
.ct-eyebrow { font: 500 9px/1 var(--font-mono); letter-spacing: .13em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
.ct-score-row { display: flex; gap: 14px; align-items: center; }
.ct-ring { flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; position: relative; background: conic-gradient(currentColor calc(var(--pct) * 1%), var(--bg-raised) 0); }
.ct-ring::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg-surface); }
.ct-ring > div { position: relative; text-align: center; line-height: 1; }
.ct-ring b { display: block; font: 700 16px/1 var(--font-mono); color: var(--text-primary); }
.ct-ring small { font: 500 9px/1 var(--font-mono); color: var(--text-dim); }
.ct-subs { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.ct-subs > div { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; font: 500 9.5px/1 var(--font-mono); color: var(--text-muted); }
.ct-subs i { height: 3px; border-radius: 2px; background: var(--bg-raised); overflow: hidden; display: block; width: 100%; }
.ct-subs em { display: block; height: 100%; border-radius: 2px; }
.ct-subs b { font-weight: 700; font-size: 11px; }
.ct-subs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }

/* šoniniai blokai: pelnas + rizikos */
.ct-sides { grid-column: 1 / 3; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 14px 14px; }
.ct-side { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elevated); font-size: 12.5px; color: var(--text-secondary); }
.ct-side-pos { background: var(--success-dim); border-color: var(--success-border); } .ct-side-pos .ct-side-ic { background: var(--success); color: #0A0C12; } .ct-side-pos .ct-side-big { color: var(--success); }
.ct-side-warn { background: var(--warning-dim); border-color: var(--warning-border); } .ct-side-warn .ct-side-ic { background: var(--warning); color: #0A0C12; } .ct-side-warn .ct-side-big { color: var(--warning); }
.ct-side-neg { background: var(--danger-dim); border-color: var(--danger-border); } .ct-side-neg .ct-side-ic { background: var(--danger); color: #fff; }
.ct-side-muted .ct-side-ic { background: var(--bg-raised); color: var(--text-muted); }
.ct-side-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-primary); }
.ct-side-h b { margin-left: auto; font: 600 11px/1 var(--font-mono); padding: 4px 6px; border-radius: 5px; background: rgba(10,12,18,.4); color: var(--text-secondary); }
.ct-side-ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); flex: none; }
.ct-side-big { font-size: 15px; font-weight: 700; margin-top: 8px; } .ct-side-big span { font: 600 12px var(--font-mono); opacity: .8; }
.ct-side p { margin: 8px 0 0; color: var(--text-muted); font-size: 12px; line-height: 1.45; }
.ct-side ul { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.ct-side li { position: relative; padding-left: 12px; font-size: 12px; line-height: 1.4; color: var(--text-secondary); }
.ct-side li::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; }
.ct-table > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.ct-table > div:last-child { border-bottom: none; } .ct-table span { color: var(--text-muted); } .ct-table b { font-weight: 600; text-align: right; }
.ct-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 7px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.06); font-size: 12px; } .ct-kv span { color: var(--text-muted); white-space: nowrap; } .ct-kv b { color: var(--text-primary); font-weight: 600; text-align: right; min-width: 0; word-break: break-word; max-width: 65%; line-height: 1.35; }
.ct-mini { margin-top: 10px; height: 28px; padding: 0 10px; border-radius: 6px; background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.ct-mini:hover { background: rgba(255,255,255,.06); }

/* ===== DETALĖS PANELĖ ===== */
.ct-card .detail-panel.ct-panel { margin: 0; padding: 0 16px 16px; background: var(--bg-surface); border-top: 1px solid var(--border); border-left: none; border-radius: 0; font-size: 13px; }
.ct-card .detail-panel.ct-panel > span { display: block; padding: 14px 0; color: var(--text-muted); font-size: 12.5px; }
.ct-cache { font: 500 10.5px/1 var(--font-mono); color: var(--text-dim); padding: 10px 0 0; } .ct-cache a { color: var(--accent-light); }
.ct-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; scrollbar-width: none; }
.ct-tabs::-webkit-scrollbar { display: none; }
.ct-tab { flex: none; height: 32px; padding: 0 12px; border-radius: 8px; background: transparent; border: 1px solid transparent; color: var(--text-muted); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.ct-tab:hover { background: var(--bg-elevated); color: var(--text-primary); }
.ct-tab.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent-light); font-weight: 600; }
.ct-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ct-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ct-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ct-box { padding: 14px; border-radius: 12px; background: var(--bg-elevated); border: 1px solid var(--border); min-width: 0; }
.ct-box-ai { border-color: var(--accent-border); } .ct-box-warn { border-color: var(--warning-border); } .ct-box-neg { border-color: var(--danger-border); }
.ct-box-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px; }
.ct-box-ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 700 10px/1 var(--font-mono); background: var(--bg-raised); color: var(--text-muted); flex: none; }
.ct-box p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--text-secondary); text-wrap: pretty; }
.ct-box p + p { margin-top: 8px; }
.ct-muted { color: var(--text-muted) !important; }
.ct-dash { color: var(--text-dim) !important; }
.ct-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ct-list li { position: relative; padding-left: 16px; font-size: 12.5px; line-height: 1.45; color: var(--text-secondary); }
.ct-list li::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex: none; }
.ct-list-pos li::before { background: var(--success); } .ct-list-warn li::before { background: var(--warning); } .ct-list-neg li::before { background: var(--danger); }
.ct-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.ct-tags span { white-space: nowrap; font-size: 12px; padding: 6px 9px; border-radius: 6px; background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-secondary); }
.ct-tags .ct-tag-more { color: var(--accent-light); border-color: var(--accent-border); background: var(--accent-dim); cursor: pointer; }
.ct-vin { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ct-vin code { font: 600 13px var(--font-mono); letter-spacing: .05em; color: var(--text-primary); }
.ct-vin .ct-mini { margin-top: 0; }
.ct-stat { padding: 14px; border-radius: 12px; background: var(--bg-elevated); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.ct-stat span { font: 500 9px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); }
.ct-stat b { font: 700 20px/1 var(--font-mono); letter-spacing: -.02em; color: var(--text-primary); }
.ct-stat small { font-size: 11.5px; color: var(--text-muted); }
.ct-posbar { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--success), var(--bg-raised) 50%, var(--danger)); opacity: .9; }
.ct-posbar em { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--border-light); }
.ct-posbar i { position: absolute; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg-elevated); transform: translateX(-50%); box-shadow: 0 0 0 1px var(--accent); }
.ct-posbar-l { display: flex; justify-content: space-between; margin-top: 10px; font: 500 10px/1 var(--font-mono); color: var(--text-dim); }
.ct-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.ct-gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: zoom-in; background: var(--bg-elevated); }

/* Panelė kitur (tinder / visi skelbimai) — be kortelės konteksto */
.detail-panel:not(.ct-panel) .ct-tabs { padding-top: 0; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .ct-grid { grid-template-columns: 240px minmax(0, 1fr); }
  .ct-photo { grid-row: 1; }
  .ct-score { }
  .ct-sides { grid-column: 1 / 3; padding: 0 16px 14px 14px; }
  .ct-subs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ct-cols, .ct-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .ct-grid { grid-template-columns: 1fr; }
  .ct-photo { padding: 12px 12px 0; }
  .ct-main { padding: 12px; }
  .ct-sides { grid-column: 1; padding: 0 12px 12px; }
  .ct-subs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ct-sides, .ct-cols, .ct-cols-2, .ct-cols-3 { grid-template-columns: 1fr; }
  .ct-price { font-size: 22px; }
}

/* ── v1.12 new card design CSS ── */
.ct-ring-inner{position:relative;text-align:center;line-height:1;}
.ct-ring-lg{width:58px;height:58px;} .ct-ring-lg b{font-size:16px;}
.ct-ring-sm{width:40px;height:40px;} .ct-ring-sm b{font-size:12px;}
.ct-ring-sm::before{inset:4px;}
.ct-bar-fill{height:100%;border-radius:2px;width:var(--w,50%);transition:width .3s;}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;background:var(--bg-elevated);border:1px solid var(--border);font-size:11.5px;color:var(--text-secondary);white-space:nowrap;flex:none;}
.chip-pos{background:var(--success-dim);border-color:var(--success-border);color:var(--success);}
.chip-warn{background:var(--warning-dim);border-color:var(--warning-border);color:var(--warning);}
.chip-ac{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent-light);}
.diff-pos{background:var(--success-dim);border:1px solid var(--success-border);color:var(--success);}
.diff-warn{background:var(--warning-dim);border:1px solid var(--warning-border);color:var(--warning);}
.diff-neg{background:var(--danger-dim);border:1px solid var(--danger-border);color:var(--danger);}
.ct-top-card{background:var(--bg-surface);border-radius:16px;overflow:hidden;margin-bottom:12px;transition:box-shadow .2s,border-color .2s;}
.ct-top-card:hover{box-shadow:0 8px 32px rgba(0,0,0,.45);}
.ct-std-card{display:flex;flex-wrap:wrap;align-items:stretch;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;transition:border-color .15s;}
/* Auto istorijos blokas visada eina PER VISA PLOTI po kortelės turiniu, o ne
   įsiterpia į flex eilutę šalia teksto ir jo nespaudžia. */

.ct-std-card:hover{border-color:var(--border-light);}
.photo-ph{background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 8px),#141822;display:flex;align-items:center;justify-content:center;}

.ctin:nth-child(3){animation-delay:.1s}
.ctin:nth-child(4){animation-delay:.15s}

}

}

  /* Search hero — senasis */

/* ── PATAISYMAI PO DIZAINO PERDAVIMO (Claude Code) ───────────────────────────
   1) .ct3-hero/.ct3-stats/.ct3-search-panel naudoja "full-bleed" triuką
      width:100vw + margin-left:calc((100% - 100vw)/2). Mobiliajame dizaine
      margin buvo perrašytas į "0 10px !important", todėl neigiama kraštinė
      dingo, o 100vw plotis liko → horizontalus slinkimas.
   2) <select> turi savo min-content plotį (pagal ilgiausią parinktį), todėl
      "1fr 1fr" tinklelio takelis išsipučia. Reikia minmax(0,1fr) + min-width:0.
   ─────────────────────────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  /* Full-bleed elementai: kai margin perrašomas, 100vw plotis nebeturi
     kompensuojančios neigiamos kraštinės - grąžinam juos į normalų srautą. */
  .ct3-hero, .ct3-stats-bar, .ct3-search-panel {
    width: auto !important; max-width: none !important; margin-left: 0 !important; margin-right: 0 !important;
  }
  .ct3-stats-bar { margin: 6px 10px 0 !important; }
  .ct3-search-panel { margin: 0 10px !important; }

  #results > div > span[style*="letter-spacing"] { display: none; }

  /* Nuotraukų stulpelis: max-height 260px apkarpydavo stulpelį, bet turinys
     (nuotrauka 230px + miniatiūros 115px + tarpai) aukštesnis, todėl
     miniatiūros išlįsdavo ir užlipdavo ant modelio pavadinimo. Leidžiam
     stulpeliui augti natūraliai, o nuotrauką padarom kompaktiškesnę. */
  .top-photo-col { max-height: none !important; padding-bottom: 12px !important; }
  .top-photo-col .photo-ph {
    flex: none !important; min-height: 0 !important;
    aspect-ratio: 16 / 10; max-height: 215px !important;
  }
  .ct3-fields { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .ct3-field, .ct3-select-wrap, .ct3-range-wrap { min-width: 0 !important; }
  .ct3-field select,
  .ct3-field input { min-width: 0 !important; width: 100% !important; max-width: 100% !important; }
  .ct3-search-inner { padding: 0 12px !important; }
  .ct3-stats-inner { padding: 14px 12px !important; }
  .ct3-stats-inner { flex-wrap: wrap; }
}
@media (max-width: 480px) {
  .ct3-fields { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .ct3-search-inner { padding: 0 10px !important; }
}


/* ── blokas #3 ── */

/* ── Compare modal header ── */

/* ── Compare table ── */
.ct-cmp-tbl { width: 100%; border-collapse: collapse; min-width: 440px; }

.ct-cmp-photo { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--bg-raised); display: block; margin-bottom: 8px; }
.ct-cmp-car-name { font: 700 14px/1.2 var(--font); color: var(--text-primary); margin-bottom: 4px; }

.ct-cmp-tbl th.car-h.winner { background: oklch(.75 .15 158/.06); border-top: 2px solid var(--success); }
.ct-cmp-tbl th.car-h.winner .ct-cmp-car-num { background: var(--success-dim); border-color: var(--success-border); color: var(--success); }

/* ── Table body ── */
.ct-cmp-tbl td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }

.ct-cmp-diff.neg { color: var(--danger); background: var(--danger-dim); border-color: var(--danger-border); }

/* ── Compare empty state ── */
.ct-cmp-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; gap: 12px; }
.ct-cmp-empty-ic { width: 52px; height: 52px; border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-dim); margin-bottom: 4px; }

/* ── Deep compare ── */
.dc-section { margin-bottom: 16px; }

/* Winner banner */
.dc-winner { padding: 18px 20px; border-radius: 14px; background: linear-gradient(135deg, oklch(.75 .15 158/.12), oklch(.75 .15 158/.04)); border: 1px solid var(--success-border); }
.dc-winner-label { font: 700 9px/1 var(--font-mono); letter-spacing: .15em; text-transform: uppercase; color: var(--success); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
.dc-winner-name { font: 700 20px/1.1 var(--font); letter-spacing: -.02em; color: var(--text-primary); margin-bottom: 8px; }

.dc-crit-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; overflow-x: auto; }

.dc-crit-cell { padding: 11px 13px; font: 400 12.5px/1.5 var(--font); color: var(--text-secondary); }

.dc-cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 10px; }
.dc-card { padding: 14px 16px; border-radius: 12px; background: var(--bg-raised); border: 1px solid var(--border); }

.dc-profile-name { font: 700 14px/1.2 var(--font); color: var(--text-primary); margin-bottom: 4px; }

.dc-sublist-label.warn { color: var(--warning); }

<!-- ============================================================================
     ct-ikonos.html · CarTriige · piktogramų rinkinys
     ----------------------------------------------------------------------------
     Keturiolika piktogramų, vienas failas, jokio išorinio paketo.
     Įdėkite šį bloką VIENĄ kartą į kiekvieno puslapio <body> pradžią.

     Iškvietimas pagal vardą:
         <i><svg class="ct-i"><use href="#i-skelbimas"></use></svg></i>

     Visos 16×16, stroke: currentColor, be fill — spalvą nustato mygtukas.
     Vienintelė išimtis: #i-issaugoti gauna fill, kai mygtukas .is-on
     (taisyklė yra ct-mygtukai.css).
