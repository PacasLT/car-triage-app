<script>
(function () {
  const st = document.getElementById('deep-compare-status');
  const rez = document.getElementById('deep-compare-result');

  function skaityti(raktas, numatyta) {
    try { return JSON.parse(localStorage.getItem(raktas) || 'null') || numatyta; }
    catch (e) { return numatyta; }
  }

  const autos = skaityti('ct_compare_list', []);
  document.getElementById('cr-count').textContent =
    autos.length ? autos.length + ' AUTOMOBILIAI' : '';

  if (autos.length < 2) {
    st.innerHTML = '<div style="padding:22px 24px;border-radius:14px;background:var(--bg-elevated);border:1px solid var(--border);">'
      + '<div style="font:600 15px/1.4 var(--font);color:var(--text-primary);margin-bottom:8px;">Palyginimui reikia bent dviejų automobilių</div>'
      + '<div style="font:400 13px/1.7 var(--font);color:var(--text-secondary);">Grįžkite į paiešką ir prie norimų skelbimų paspauskite ⚖️ mygtuką. Vienu metu galima lyginti iki trijų.</div>'
      + '<a href="index.html" style="display:inline-flex;align-items:center;gap:7px;margin-top:14px;height:38px;padding:0 16px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font:600 13px var(--font);">Grįžti į paiešką</a>'
      + '</div>';
    return;
  }

  function rodytiKrovima() {
    const zingsniai = [
      'Nuskaitomi pilni skelbimai',
      'Analizuojamos nuotraukos su AI',
      'Tikrinami VIN ir pardavėjo duomenys',
      'Lyginami automobiliai tarpusavyje',
      'Rengiamas galutinis verdiktas',
    ];
    st.innerHTML = '<div style="padding:20px 22px;border-radius:14px;background:var(--bg-elevated);border:1px solid var(--border);">'
      + '<div style="font:600 14px/1.4 var(--font);color:var(--text-primary);margin-bottom:14px;">Analizuojami ' + autos.length + ' automobiliai… <span style="color:var(--text-dim);font-weight:400;">(iki minutės)</span></div>'
      + zingsniai.map(function (z, i) {
          return '<div id="cr-z-' + i + '" style="display:flex;align-items:center;gap:10px;padding:6px 0;opacity:.45;transition:opacity .3s;">'
            + '<span style="width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--border-light);display:inline-block;"></span>'
            + '<span style="font:400 12.5px/1.5 var(--font);color:var(--text-secondary);">' + z + '</span></div>';
        }).join('')
      + '</div>';
    let i = 0;
    const laikm = setInterval(function () {
      const el = document.getElementById('cr-z-' + i);
      if (el) {
        el.style.opacity = '1';
        el.querySelector('span').outerHTML =
          '<span style="width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;display:inline-block;animation:cr-spin .7s linear infinite;"></span>';
        const pr = document.getElementById('cr-z-' + (i - 1));
        if (pr) pr.querySelector('span').outerHTML =
          '<span style="width:16px;height:16px;flex:none;color:var(--success);font:700 12px/16px var(--font-mono);text-align:center;">✓</span>';
      }
      i++;
      if (i >= zingsniai.length) clearInterval(laikm);
    }, 2600);
    return function () { clearInterval(laikm); };
  }

  const stabdyti = rodytiKrovima();

  // Jei ataskaita jau paruošta anksčiau – rodom iš karto, be pakartotinės užklausos
  const issaugota = skaityti('ct_compare_result', null);
  if (issaugota && issaugota.autosRaktas === autos.map(function (a) { return a.url; }).join('|')) {
    stabdyti(); st.innerHTML = '';
    window.ctRenderCompareReport(issaugota.duomenys);
    return;
  }

  const tok = (function () { try { return localStorage.getItem('ct_token'); } catch (e) { return null; } })();
  fetch('/api/compare-deep', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
    body: JSON.stringify({ autos: autos }),
  }).then(function (r) {
    return r.text().then(function (t) {
      let d; try { d = JSON.parse(t); } catch (e) { throw new Error('Serveris grąžino ne JSON: ' + t.slice(0, 120)); }
      if (!r.ok) throw new Error(d.error || ('Serverio klaida ' + r.status));
      return d;
    });
  }).then(function (d) {
    stabdyti(); st.innerHTML = '';
    try {
      localStorage.setItem('ct_compare_result', JSON.stringify({
        autosRaktas: autos.map(function (a) { return a.url; }).join('|'), duomenys: d,
      }));
    } catch (e) {}
    window.ctRenderCompareReport(d);
  }).catch(function (e) {
    stabdyti();
    st.innerHTML = '<div style="display:flex;gap:12px;padding:18px 20px;border-radius:14px;background:rgba(224,122,106,.08);border:1px solid rgba(224,122,106,.3);">'
      + '<span style="flex:none;font-size:18px;line-height:1.2;">⚠</span>'
      + '<div><div style="font:600 14px/1.4 var(--font);color:#e9a08f;margin-bottom:5px;">Nepavyko paruošti ataskaitos</div>'
      + '<div style="font:400 12.5px/1.6 var(--font);color:var(--text-secondary);">' + String(e.message).slice(0, 220) + '</div>'
      + '<button onclick="location.reload()" style="margin-top:12px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--border-light);background:transparent;color:var(--text-primary);font:600 12px var(--font);cursor:pointer;">Bandyti dar kartą</button>'
      + '</div></div>';
  });
})();
</script>
