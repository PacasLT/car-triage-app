<!-- ct-sesija.js: vienintelis zetono ir sesijos saltinis (revizija A-1..A-3, A-7).
     Deti PIRMA: jis apvynioja fetch, tad turi buti anksciau uz bet ka, kas kviecia API. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body { background: var(--bg-base); color: var(--text-primary); font-family: var(--font); margin: 0; }
.pg { max-width: 1240px; margin: 0 auto; padding: 26px 16px 80px; }
.pg-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.pg-head h1 { margin: 0; font: 700 22px/1.2 var(--font); flex: 1; }
.pg-head .kiek { font: 600 11px/1 var(--font-mono); color: var(--accent-light); background: var(--accent-dim); border: 1px solid var(--accent-border); padding: 5px 9px; border-radius: 7px; }
.pg-sub { color: var(--text-muted); font-size: 13px; margin: -8px 0 18px; }
.pg-tuscia { text-align: center; padding: 60px 20px; background: var(--bg-surface); border: 1px dashed var(--border-light); border-radius: 16px; color: var(--text-muted); font-size: 14px; }
.pg-tuscia b { display: block; color: var(--text-primary); font-size: 16px; margin-bottom: 8px; }
.pg-tuscia a { color: var(--accent-light); }
.filtrai { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.filtrai button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-secondary); font: 500 12.5px var(--font); cursor: pointer; }
.filtrai button.on { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent-light); }
.filtrai button b { font-family: var(--font-mono); font-weight: 600; margin-left: 5px; opacity: .8; }
.at-card { position: relative; display: flex; gap: 14px; align-items: center; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.at-card:hover { border-color: var(--border-light); }
.at-ic { width: 44px; height: 44px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 18px; background: var(--bg-elevated); border: 1px solid var(--border); overflow: hidden; }
.at-ic img { width: 100%; height: 100%; object-fit: cover; }
.at-info { flex: 1; min-width: 0; }
.at-tipas { font: 600 9px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; padding: 3px 6px; border-radius: 5px; display: inline-block; margin-bottom: 5px; }
.at-tipas.analize { background: var(--accent-dim); color: var(--accent-light); border: 1px solid var(--accent-border); }
.at-tipas.palyginimas { background: var(--success-dim); color: var(--success); border: 1px solid var(--success-border); }
.at-tipas.vin { background: var(--warning-dim); color: var(--warning); border: 1px solid var(--warning-border); }
.at-tipas.pardavejas { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-light); }
.at-title { font: 700 14px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.at-sant { font: 400 12.5px/1.5 var(--font); color: var(--text-muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.at-meta { font: 500 10.5px var(--font-mono); color: var(--text-dim); margin-top: 6px; }
.at-right { flex: none; display: flex; gap: 8px; align-items: center; }
/* v1.42.0: ✕ išimtas iš veiksmų eilės – dešinysis viršus, atokiai nuo pirminio */
.at-del-top { position: absolute; top: 10px; right: 10px; z-index: 2; }
.at-btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-light); background: transparent; color: var(--text-primary); font: 500 12.5px var(--font); cursor: pointer; white-space: nowrap; }
.at-btn.ac { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.at-btn.ac:hover { background: var(--accent-light); }
.at-btn.del { color: var(--text-muted); width: 34px; padding: 0; }
.at-btn.del:hover { color: var(--danger); border-color: var(--danger-border); }
/* VIN / pardavėjo ataskaita rodoma vietoje */
.at-inline { grid-column: 1 / -1; width: 100%; margin-top: 10px; padding: 12px 14px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; font: 400 13px/1.6 var(--font); color: var(--text-secondary); white-space: pre-wrap; }
.at-inline b { color: var(--text-primary); }
.at-card.open { flex-wrap: wrap; }
@media (max-width: 640px) {
  .at-card { flex-wrap: wrap; }
  .at-right { width: 100%; justify-content: flex-end; }
}
</style>
</head>

         <i><svg class="ct-i"><use href="#i-skelbimas"></use></svg></i>

<svg width="0" height="0" style="position: absolute; overflow: hidden" aria-hidden="true" focusable="false">
  <defs>

    <!-- skelbimas · išorinė nuoroda į portalą -->

      <path d="M9.5 3H13v3.5"/>

    <!-- palyginti · du keliai priešingomis kryptimis -->

         bet trikampyje — cia kalba sistema, ne zmogus. -->
    <symbol id="i-klaida" viewBox="0 0 16 16">

    </symbol>

    <!-- pardavejas -->
    <symbol id="i-pardavejas" viewBox="0 0 16 16">

    <!-- nuotraukos · vizualinė analizė -->

    <!-- planai · prenumeratos lygiai -->

<div class="pg">
  <div class="pg-head"><h1>Ataskaitos</h1><span class="kiek" id="kiek">–</span></div>
  <p class="pg-sub">Viskas, ką sugeneravote už kreditus: gilios analizės, palyginimai, VIN ir pardavėjų patikros. Atidaromos nemokamai.</p>
  <div class="filtrai" id="filtrai"></div>
  <div id="sarasas"><div class="pg-tuscia">Kraunama…</div></div>
</div>

<script src="versijos.js"></script>
<script src="megstami-meniu.js"></script>
<script src="paskyra-meniu.js"></script>
<script src="ct-bendras.js"></script>
<script>
const TIPAI = { analize: ['Gili analizė', '🔬'], palyginimas: ['Palyginimas', '⚖️'], vin: ['VIN istorija', '🔑'], pardavejas: ['Pardavėjas', '🏢'] };
let visos = [], filtras = (function () { try { return new URLSearchParams(location.search).get('tipas') || ''; } catch (e) { return ''; } })();

(async function () {
  const el = document.getElementById('sarasas');
  if (!ctToken()) { el.innerHTML = '<div class="pg-tuscia"><b>Prisijunkite</b>Ataskaitos saugomos prie paskyros.<br><br><a href="index.html">Į paiešką →</a></div>'; return; }
  try {
    const r = await ctApi('/api/ataskaitos');
    if (r.status === 401) { el.innerHTML = '<div class="pg-tuscia"><b>Sesija baigėsi</b><a href="index.html">Prisijunkite iš naujo →</a></div>'; return; }
    visos = (await r.json()).sarasas || [];
  } catch (e) { el.innerHTML = '<div class="pg-tuscia">Nepavyko įkelti: ' + ctEsc(e.message) + '</div>'; return; }
  piesti();
})();

function piesti() {
  const el = document.getElementById('sarasas'), kiek = document.getElementById('kiek'), fl = document.getElementById('filtrai');
  kiek.textContent = visos.length;
  const kiekTipo = {}; visos.forEach(function (a) { kiekTipo[a.tipas] = (kiekTipo[a.tipas] || 0) + 1; });
  fl.innerHTML = '<button class="' + (filtras ? '' : 'on') + '" onclick="filtruoti(\'\')">Visos<b>' + visos.length + '</b></button>'
    + Object.keys(TIPAI).filter(function (t) { return kiekTipo[t]; }).map(function (t) {
      return '<button class="' + (filtras === t ? 'on' : '') + '" onclick="filtruoti(\'' + t + '\')">' + TIPAI[t][0] + '<b>' + kiekTipo[t] + '</b></button>';
    }).join('');
  const list = filtras ? visos.filter(function (a) { return a.tipas === filtras; }) : visos;
  // v1.25.0: atidarius „Palyginimai" pirmiausia rodom, KURIUOS automobilius šiuo metu lygini -
  // anksciau matydavosi tik tuscias ataskaitu sarasas ir atrodydavo, kad palyginimas dingo.
  let virsus = '';
  if (filtras === 'palyginimas') {
    let dabar = [];
    try { dabar = JSON.parse(localStorage.getItem('ct_compare_list') || '[]') || []; } catch (e) {}
    if (dabar.length) {
      virsus = '<div style="background:var(--bg-surface);border:1px solid var(--accent-border);border-radius:16px;padding:16px;margin-bottom:16px">'
        + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">'
        + '<b style="font:700 13px var(--font)">Dabartinis palyginimas</b>'
        + '<span style="font:600 10px var(--font-mono);color:var(--text-dim)">' + dabar.length + ' automobiliai</span>'
        + '<a href="compare.html" style="margin-left:auto;padding:7px 13px;border-radius:9px;background:var(--accent);color:#fff;font:600 12px var(--font);text-decoration:none">Tęsti palyginimą →</a>'
        + '</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">'
        + dabar.map(function (c) {
            return '<a href="' + ctEsc(c.url || '#') + '" target="_blank" rel="noopener" style="text-decoration:none;display:block;background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;overflow:hidden">'
              + (c.photo ? '<img src="' + ctEsc(c.photo) + '" alt="" loading="lazy" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block">' : '')
              + '<div style="padding:9px 11px">'
              + '<div style="font:600 12.5px var(--font);color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + ctEsc(c.modelis || 'Automobilis') + '</div>'
              + '<div style="font:700 12px var(--font-mono);color:var(--text-secondary);margin-top:3px">' + (c.kaina ? Number(c.kaina).toLocaleString('lt-LT') + ' €' : '–') + '</div>'
              + (c.metai || c.rida ? '<div style="font:400 11px var(--font);color:var(--text-dim);margin-top:2px">' + [c.metai, c.rida ? Number(c.rida).toLocaleString('lt-LT') + ' km' : null].filter(Boolean).join(' · ') + '</div>' : '')
              + '</div></a>';
          }).join('')
        + '</div></div>';
    }
  }
  if (!list.length) {
    el.innerHTML = virsus + '<div class="pg-tuscia"><b>' + (filtras === 'palyginimas' ? 'Palyginimų ataskaitų dar nėra' : 'Ataskaitų dar nėra') + '</b>'
      + (filtras === 'palyginimas'
        ? 'Palyginkite bent du automobilius ir paspauskite „Gilus palyginimas“ – ataskaita atsiras čia.'
        : 'Paieškoje paspauskite „Detali apžvalga" – ataskaita atsiras čia.')
      + '<br><br><a href="index.html">Į paiešką →</a></div>';
    return;
  }
  el.innerHTML = virsus + list.map(function (a) {
    const t = TIPAI[a.tipas] || [a.tipas, '📄'];
    const inline = (a.tipas === 'vin' || a.tipas === 'pardavejas');
    return '<div class="at-card" id="at-' + a.id + '">'
      + '<div class="at-ic">' + (a.photo ? '<img src="' + ctEsc(a.photo) + '" alt="" loading="lazy">' : t[1]) + '</div>'
      + '<div class="at-info"><span class="at-tipas ' + ctEsc(a.tipas) + '">' + t[0] + '</span>'
      + '<div class="at-title">' + ctEsc(a.pavadinimas || a.raktas) + '</div>'
      + (a.santrauka ? '<div class="at-sant">' + ctEsc(a.santrauka) + '</div>' : '')
      + '<div class="at-meta">' + ctLaikas(a.laikas) + '</div></div>'
      + '<div class="at-right ct-actions">'
      // v1.42.0, dizainerio §7: ataskaitose pirminis yra „Atidaryti" – vienintelis
      // veiksmas, kurio žmogus čia nori. Rodyklės nereikia: violetinė spalva jau
      // pasako, kad tai pagrindinis veiksmas.
      + '<button class="at-btn ct-btn ct-btn-primary" onclick="atidaryti(' + a.id + ', this)">'
      +   '<i><svg class="ct-i"><use href="#i-apzvalga"></use></svg></i>' + '<span>' + (inline ? 'Rodyti' : 'Atidaryti') + '</span></button>'
      + '</div>'
      // Naikinantis veiksmas nestovi veiksmų eilėje. Eilės gale „Ištrinti" atsidurtų
      // prie pirminio mygtuko – vienas praleistas pikselis, ir ataskaita, už kurią
      // sumokėta 2 kr, išnyksta. Vieta: kortelės dešinysis viršus.
      + '<button class="at-del-top ct-btn ct-btn-quiet ct-btn-icon ct-btn-sm is-destructive" title="Ištrinti ataskaitą" aria-label="Ištrinti ataskaitą" onclick="trinti(' + a.id + ', this)">'
      +   '<i><svg class="ct-i"><use href="#i-pasalinti"></use></svg></i>' + '</button>'
      + '</div>';
  }).join('');
}

function filtruoti(t) { filtras = t; piesti(); }

async function atidaryti(id, btn) {
  btn.disabled = true; const buvo = btn.textContent; btn.textContent = '…';
  try {
    const r = await ctApi('/api/ataskaitos/' + id);
    if (!r.ok) throw new Error('Nepavyko įkelti (' + r.status + ')');
    const a = await r.json(), d = a.duomenys || {};
    if (a.tipas === 'analize') {
      // Ta pati struktura, kuria naudoja index.html -> detail.html perdavimas
      try {
        localStorage.setItem('ct_detail', JSON.stringify({ c: d.c || { url: a.raktas }, analysis: d.analysis || null, photos: d.photos || [] }));
        // detail.html analize ima is narsykles podelio pagal url
        const cache = JSON.parse(localStorage.getItem('carTriageAnalysisCache') || '{}');
        cache[a.raktas] = { data: { analysis: d.analysis, photos: d.photos, vin: d.vin, pardavejas: d.pardavejas }, savedAt: Date.now() };
        localStorage.setItem('carTriageAnalysisCache', JSON.stringify(cache));
      } catch (e) {}
      location.href = 'detail.html'; return;
    }
    if (a.tipas === 'palyginimas') {
      try {
        localStorage.setItem('ct_compare_list', JSON.stringify(d.autos || []));
        localStorage.setItem('ct_compare_result', JSON.stringify({ autosRaktas: (d.autos || []).map(function (x) { return x.url; }).join('|'), duomenys: d.rezultatas }));
      } catch (e) {}
      location.href = 'compare.html'; return;
    }
    // VIN / pardavejas - rodom cia pat
    const card = document.getElementById('at-' + id);
    let sen = card.querySelector('.at-inline');
    if (sen) { sen.remove(); card.classList.remove('open'); btn.textContent = 'Rodyti'; btn.disabled = false; return; }
    const r0 = a.tipas === 'pardavejas' ? (d.rezultatas || d) : d;
    // v1.23.1: vietoj zaliu lauku ("rasta: false") - normalus sakiniai lietuviskai
    const eil = [];
    const LAUKAI = {
      saltinis: 'Šaltinis', zalos_aprasas: '⚠ Žala / būklė', aukciono_kaina: 'Aukciono kaina',
      papildoma_info: 'Papildomai', isvada: 'Išvada',
      imones_pavadinimas: 'Įmonė', veiklos_trukme: 'Veikia nuo', atsiliepimu_santrauka: 'Atsiliepimai',
      ispejimai: '⚠ Įspėjimai', santrauka: 'Santrauka', reputacija: 'Reputacija',
    };
    if (r0 && r0.rasta === false) {
      eil.push('<b>Rezultatas:</b> viešuose šaltiniuose įrašų apie ' + (a.tipas === 'vin' ? 'šį VIN' : 'šį pardavėją') + ' nerasta.');
      if (Array.isArray(r0.patikrinti_saltiniai) && r0.patikrinti_saltiniai.length) {
        eil.push('<b>Patikrinta:</b> ' + ctEsc(r0.patikrinti_saltiniai.join(', ')));
      }
    } else if (r0 && r0.rasta === true) {
      eil.push('<b>Rezultatas:</b> rasta viešų įrašų.');
    }
    Object.keys(r0 || {}).forEach(function (k) {
      if (['cached', 'cacheAgeMinutes', 'nuoroda', 'rasta', 'patikrinti_saltiniai', 'nepavyko'].indexOf(k) !== -1) return;
      const v = r0[k]; if (v == null || v === '' || (Array.isArray(v) && !v.length)) return;
      const etikete = LAUKAI[k] || (k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, ' '));
      eil.push('<b>' + ctEsc(etikete) + ':</b> ' + ctEsc(Array.isArray(v) ? v.join('; ') : (typeof v === 'object' ? JSON.stringify(v) : v)));
    });
    if (r0 && r0.nuoroda && /^https?:\/\//i.test(String(r0.nuoroda))) eil.push('<a href="' + ctEsc(r0.nuoroda) + '" target="_blank" rel="noopener" style="color:var(--accent-light)">Šaltinis ↗</a>');
    card.classList.add('open');
    card.insertAdjacentHTML('beforeend', '<div class="at-inline">' + (eil.join('\n') || 'Duomenų nėra.') + '</div>');
    btn.textContent = 'Slėpti'; btn.disabled = false;
  } catch (e) { btn.textContent = buvo; btn.disabled = false; alert(e.message); }
}

async function trinti(id, btn) {
  if (!confirm('Ištrinti šią ataskaitą?')) return;
  btn.disabled = true;
  try {
    await ctApi('/api/ataskaitos/' + id, { method: 'DELETE' });
    visos = visos.filter(function (a) { return a.id !== id; }); piesti();
  } catch (e) { btn.disabled = false; alert('Nepavyko ištrinti'); }
}
