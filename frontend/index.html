<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>CarTriige — Automobilių paieška</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; background: #0a0c12; color: #e2e4f0; min-height: 100vh; }

/* ====== NAV ====== */
.nav-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,12,18,0.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid #1e2130;
  padding: 0 24px; display: flex; align-items: center; gap: 0; height: 54px;
}
.nav-logo { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-right: 28px; white-space: nowrap; }
.nav-logo span { color: #7c6ff0; }
.nav-version { font-size: 10px; color: #3a3f55; font-weight: 400; margin-left: 6px; }
.nav-tabs { display: flex; gap: 2px; flex: 1; }
.nav-tab { background: none; border: none; color: #7a7f9a; font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.nav-tab:hover { color: #e2e4f0; background: #13172a; }
.nav-tab.active { color: #fff; background: #1e2340; }

/* ====== LAYOUT ====== */
.page-content { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ====== SEARCH PANEL ====== */
.search-panel {
  background: #10131a; border: 1px solid #1e2130; border-radius: 16px;
  padding: 22px 22px 18px; margin-bottom: 20px;
}
.search-panel-title { font-size: 13px; font-weight: 600; color: #7c6ff0; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; }
.filter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.filter-group label { display: block; font-size: 11px; color: #6a6f88; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.filter-grid input, .filter-grid select {
  width: 100%; padding: 9px 11px; border-radius: 8px;
  border: 1px solid #1e2130; background: #0d1018; color: #e2e4f0;
  font-size: 14px; transition: border-color 0.15s;
}
.filter-grid input:focus, .filter-grid select:focus { outline: none; border-color: #7c6ff0; }
.filter-full { grid-column: 1/-1; }
.portal-row { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 2px; }
.portal-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #e2e4f0; cursor: pointer; }
.portal-label input[type=checkbox] { width: auto; accent-color: #7c6ff0; }
.btn-search {
  grid-column: 1/-1; padding: 12px; background: linear-gradient(135deg, #7c6ff0, #a78bfa);
  color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 6px; transition: opacity 0.15s;
  box-shadow: 0 4px 18px rgba(124,111,240,0.35);
}
.btn-search:hover { opacity: 0.88; }
.btn-search:disabled { background: #2a2d3a; color: #555; cursor: not-allowed; box-shadow: none; }
.btn-quickcount {
  padding: 8px 14px; background: #1a1d2a; color: #a78bfa; border: 1px solid #2c2f45;
  border-radius: 8px; font-size: 12px; cursor: pointer;
}
.generation-hint { font-size: 12px; color: #a78bfa; background: #13162a; padding: 8px 10px; border-radius: 8px; display: none; }

/* ====== PROGRESS / LOG ====== */
#status { color: #7a7f9a; font-size: 14px; margin-bottom: 12px; min-height: 20px; }
#search-progress-wrap { display: none; margin: -4px 0 12px; }
#search-progress-track-main { height: 3px; background: #1a1d2a; border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
#search-progress-fill-main { height: 100%; background: linear-gradient(90deg, #7c6ff0, #a78bfa); border-radius: 4px; transition: width 0.5s ease; width: 0%; }
#search-progress-label { font-size: 11px; color: #7c6ff0; font-weight: 600; }
#log-container { margin-bottom: 14px; display: none; }
#log-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #10131a; border: 1px solid #1e2130; border-radius: 10px; cursor: pointer; font-size: 13px; color: #9a9db8; user-select: none; }
#log-header:hover { background: #13172a; }
#log-header .chevron { margin-left: auto; transition: transform 0.2s; color: #555; }
#log-header.expanded .chevron { transform: rotate(180deg); }
#log-box { background: #0d1018; border: 1px solid #1e2130; border-top: none; border-radius: 0 0 10px 10px; padding: 4px; max-height: 240px; overflow-y: auto; display: none; }
.log-step { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 12px; color: #9a9db8; border-bottom: 1px solid #181b28; }
.log-step:last-child { border-bottom: none; }
.log-step .spinner { width: 13px; height: 13px; border: 2px solid #2c2f45; border-top-color: #7c6ff0; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
.log-step .done-check { color: #34d399; flex-shrink: 0; font-size: 11px; }
.log-step.current { color: #e2e4f0; font-weight: 500; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ====== SORT BAR ====== */
#sort-bar { display: none; margin-bottom: 16px; align-items: center; gap: 12px; flex-wrap: wrap; }
#sort-bar label { font-size: 12px; color: #6a6f88; }
#sort-select { padding: 7px 10px; border-radius: 8px; border: 1px solid #1e2130; background: #10131a; color: #e2e4f0; font-size: 13px; }
#tinder-launch-btn { display: none; }

/* ====== CARD (premium horizontal) ====== */
.card {
  background: #10131a; border: 1px solid #1e2130; border-radius: 14px;
  margin-bottom: 12px; display: flex; overflow: hidden; position: relative;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.card:hover { border-color: #2c2f55; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }

/* Photo section */
.card-photo-section { width: 200px; flex-shrink: 0; position: relative; background: #0d1018; }
.card-photo-section img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-photo-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(10,12,18,0.7); color: #fff; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 14px; cursor: pointer; line-height: 1; padding: 0; z-index: 2; }
.card-photo-nav.prev { left: 4px; }
.card-photo-nav.next { right: 4px; }
.card-photo-count { position: absolute; bottom: 4px; right: 6px; background: rgba(10,12,18,0.75); color: #c0c4e0; font-size: 10px; padding: 1px 6px; border-radius: 10px; }

/* Info section */
.card-info { flex: 1; padding: 14px 14px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.card-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-rank { font-size: 11px; color: #4a4f6a; font-weight: 600; }
.card-title { font-size: 15px; font-weight: 700; color: #fff; }
.source-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #1a1d2a; color: #6a6f88; margin-left: 5px; vertical-align: middle; }
.fav-btn { background: rgba(10,12,18,0.6); border: none; color: #4a4f6a; font-size: 18px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; flex-shrink: 0; transition: color 0.15s; }
.fav-btn.active { color: #f0c674; }
.card-price-row { display: flex; align-items: baseline; gap: 8px; }
.card-price { font-size: 20px; font-weight: 800; color: #fff; }
.card-discount { font-size: 13px; font-weight: 700; background: rgba(52,211,153,0.15); color: #34d399; padding: 2px 8px; border-radius: 20px; }
.card-discount.danger { background: rgba(248,113,113,0.12); color: #f87171; }
.pvm-note { color: #f0c674; font-size: 12px; }
.risk-banner { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); color: #f87171; padding: 7px 10px; border-radius: 8px; font-size: 12px; }
.card-meta { font-size: 12px; color: #6a6f88; line-height: 1.5; }
.rida-note-good { color: #34d399; font-size: 12px; }
.rida-note-bad { color: #f87171; font-size: 12px; }
.cross-list-note { color: #6a6f88; font-size: 12px; }
.card-comment { font-size: 13px; color: #c0c4d8; line-height: 1.45; }

/* Insight badges */
.insight-badges { display: flex; flex-wrap: wrap; gap: 5px; }
.insight-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
.insight-badge.good { background: rgba(52,211,153,0.12); color: #34d399; border: 1px solid rgba(52,211,153,0.2); }
.insight-badge.ok { background: rgba(124,111,240,0.12); color: #a78bfa; border: 1px solid rgba(124,111,240,0.2); }
.insight-badge.warn { background: rgba(251,146,60,0.12); color: #fb923c; border: 1px solid rgba(251,146,60,0.2); }

/* Card actions */
.card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.btn-link { color: #7c6ff0; font-size: 12px; text-decoration: none; padding: 5px 10px; background: rgba(124,111,240,0.1); border-radius: 7px; white-space: nowrap; }
.btn-link:hover { background: rgba(124,111,240,0.2); }
.btn-detail { background: #1a1d2a; color: #e2e4f0; border: 1px solid #2c2f45; padding: 5px 12px; border-radius: 7px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.btn-detail:hover { background: #23263a; }
.btn-detail.ready { background: linear-gradient(135deg, #7c6ff0, #a78bfa); color: #fff; font-weight: 600; border-color: transparent; box-shadow: 0 0 14px rgba(124,111,240,0.4); animation: pulse-glow 2.5s ease-in-out infinite; }
@keyframes pulse-glow { 0%,100%{ box-shadow:0 0 8px rgba(124,111,240,0.35); } 50%{ box-shadow:0 0 18px rgba(167,139,250,0.6); } }
.btn-compare { background: #1a1d2a; color: #6a6f88; border: 1px solid #2c2f45; padding: 5px 10px; border-radius: 7px; font-size: 11px; cursor: pointer; white-space: nowrap; }
.btn-compare.active { background: rgba(74,144,217,0.15); color: #74c0fc; border-color: #4a90d9; }

/* Score section (right column) */
.card-score-divider { width: 1px; background: #1e2130; flex-shrink: 0; margin: 14px 0; }
.card-score-section { width: 120px; flex-shrink: 0; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.score-ring-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
.score-center { position: absolute; text-align: center; line-height: 1; }
.score-value { font-size: 17px; font-weight: 800; color: #fff; display: block; }
.score-label { font-size: 9px; color: #6a6f88; display: block; }
.sub-scores { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.sub-score-row { display: flex; align-items: center; gap: 5px; }
.sub-score-name { font-size: 9px; color: #6a6f88; width: 38px; flex-shrink: 0; }
.sub-score-bar { flex: 1; height: 4px; background: #1a1d2a; border-radius: 4px; overflow: hidden; }
.sub-score-fill { height: 100%; border-radius: 4px; }
.score-fill-good { background: #34d399; }
.score-fill-ok { background: #fb923c; }
.score-fill-bad { background: #f87171; }

/* ====== DETAIL PANEL (tabbed) ====== */
.detail-panel { display: none; background: #0d1018; border-top: 1px solid #1e2130; padding: 0; }
.detail-tabs { display: flex; gap: 0; border-bottom: 1px solid #1e2130; padding: 0 16px; overflow-x: auto; }
.detail-tab { background: none; border: none; border-bottom: 2px solid transparent; color: #6a6f88; font-size: 12px; font-weight: 500; padding: 10px 14px; cursor: pointer; white-space: nowrap; margin-bottom: -1px; transition: color 0.15s; }
.detail-tab:hover { color: #e2e4f0; }
.detail-tab.active { color: #7c6ff0; border-bottom-color: #7c6ff0; }
.detail-tab-content { padding: 16px; }
.detail-tab-pane { display: none; }
.detail-tab-pane.active { display: block; }
.detail-section-label { font-size: 11px; color: #6a6f88; text-transform: uppercase; letter-spacing: 0.6px; margin: 12px 0 6px; font-weight: 600; }
.detail-section-label:first-child { margin-top: 0; }
.detail-verdict { font-size: 14px; font-weight: 600; color: #34d399; margin-bottom: 10px; }
.detail-list { margin: 0; padding-left: 18px; color: #c0c4d8; font-size: 13px; line-height: 1.6; }
.detail-text { font-size: 13px; color: #c0c4d8; line-height: 1.55; }
.detail-tip { background: rgba(124,111,240,0.08); border: 1px solid rgba(124,111,240,0.15); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #c0c4d8; line-height: 1.5; }
.equipment-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.equipment-chip { font-size: 12px; background: #1a1d2a; border: 1px solid #2c2f45; border-radius: 20px; padding: 4px 10px; color: #c0c4d8; }
.detail-spec-box { background: #10131a; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #c0c4d8; line-height: 1.6; }
.detail-stat-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1a1d2a; font-size: 12px; }
.detail-stat-row:last-child { border-bottom: none; }
.detail-stat-label { color: #6a6f88; }
.detail-stat-val { color: #e2e4f0; font-weight: 500; }
.perikupas-box { background: #13172a; border: 1px solid #2c2f45; border-radius: 10px; padding: 12px; }
.perikupas-title { font-weight: 700; margin-bottom: 6px; font-size: 14px; }
.photo-gallery { display: flex; flex-wrap: wrap; gap: 6px; }
.photo-gallery img { width: 80px; height: 60px; object-fit: cover; border-radius: 6px; cursor: pointer; background: #1a1d2a; }
.cache-note { color: #555; font-size: 11px; margin-bottom: 8px; }
.photo-damage-box { background: rgba(248,113,113,0.06); border: 1px solid rgba(248,113,113,0.2); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
.photo-damage-title { color: #f87171; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
.vin-box, .seller-box { background: #10131a; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 8px; }
.vin-code { font-family: monospace; color: #e2e4f0; font-size: 14px; }
.btn-lookup { font-size: 11px; padding: 4px 10px; background: #1a1d2a; color: #e2e4f0; border: 1px solid #2c2f45; border-radius: 6px; cursor: pointer; margin-left: 8px; }
.lookup-result { margin-top: 8px; }
.vin-found { background: #1a1215; border: 1px solid rgba(248,113,113,0.3); border-radius: 6px; padding: 8px 10px; font-size: 12px; }
.seller-found { background: #0f1a15; border: 1px solid rgba(52,211,153,0.2); border-radius: 6px; padding: 8px 10px; font-size: 12px; }
.cross-list-box { font-size: 13px; color: #c0c4d8; }

/* ====== ALL LISTINGS (bottom section) ====== */
#all-listings-wrap { margin-top: 24px; }
.all-listings-toggle { background: #10131a; color: #6a6f88; border: 1px solid #1e2130; padding: 10px 16px; border-radius: 10px; cursor: pointer; width: 100%; text-align: left; font-size: 13px; }
#all-listings { margin-top: 8px; }
#all-listings > div { padding: 8px; border-bottom: 1px solid #1a1d2a; }

/* ====== LIGHTBOX ====== */
#lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.93); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
#lightbox.active { display: flex; }
#lightbox img { max-width: 92vw; max-height: 76vh; object-fit: contain; border-radius: 6px; }
#lightbox-counter { color: #6a6f88; font-size: 13px; margin-top: 10px; }
#lightbox-close { position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,0.1); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; }
#lightbox-prev { left: 12px; }
#lightbox-next { right: 12px; }

/* ====== COMPARE BAR / MODAL ====== */
#compare-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #10131a, #14172a); border-top: 1px solid #1e2130; padding: 12px 20px; z-index: 900; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); }
#compare-bar.visible { display: flex; }
#compare-bar-items { display: flex; gap: 8px; flex: 1; overflow: hidden; }
.compare-bar-chip { background: #1a1d2a; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #e2e4f0; display: flex; align-items: center; gap: 6px; max-width: 160px; overflow: hidden; }
.compare-bar-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.compare-bar-chip button { background: none; border: none; color: #6a6f88; cursor: pointer; font-size: 14px; padding: 0; flex-shrink: 0; }
#compare-btn { background: linear-gradient(135deg, #7c6ff0, #a78bfa); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
#compare-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 1500; overflow-y: auto; padding: 20px; }
#compare-modal.active { display: block; }
#compare-modal-inner { max-width: 960px; margin: 0 auto; background: #10131a; border-radius: 16px; padding: 20px; position: relative; }
.compare-grid { display: grid; gap: 14px; }
.compare-col { background: #14172a; border-radius: 12px; padding: 14px; overflow: hidden; }
.compare-col img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #1a1d2a; }
.compare-col-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.compare-col-price { color: #a78bfa; font-size: 18px; font-weight: 800; margin-bottom: 10px; }
.compare-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1e2130; font-size: 12px; }
.compare-row:last-child { border-bottom: none; }
.compare-row-label { color: #6a6f88; }
.compare-row-val { color: #e2e4f0; font-weight: 500; text-align: right; max-width: 60%; }
.compare-row-val.better { color: #34d399; }
.compare-row-val.worse { color: #f87171; }
#compare-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.08); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; }

/* ====== FAVORITES ====== */
.favs-panel { background: #10131a; border: 1px solid #1e2130; border-radius: 12px; padding: 14px; }
.fav-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #1a1d2a; align-items: center; }
.fav-row:last-child { border-bottom: none; }
.fav-row img { width: 60px; height: 44px; object-fit: cover; border-radius: 6px; background: #1a1d2a; flex-shrink: 0; }

/* ====== HISTORY CHIPS ====== */
.history-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.history-chip { background: #10131a; color: #a78bfa; border: 1px solid #2c2f45; padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; }
.history-chip:hover { background: #14172a; }

/* ====== TINDER ====== */
#tinder-view { display: none; position: fixed; inset: 0; background: #0a0b0e; z-index: 1000; flex-direction: column; align-items: center; }
#tinder-view.active { display: flex; }
#tinder-topbar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 10px; flex-shrink: 0; }
#tinder-counter { font-size: 12px; color: #6a6f88; }
#tinder-close { background: rgba(44,47,69,0.8); color: #e2e4f0; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; }
#tinder-progress-track { flex: 1; margin: 0 12px; height: 3px; background: #1a1d2a; border-radius: 4px; overflow: hidden; }
#tinder-progress-fill { height: 100%; background: linear-gradient(90deg, #7c6ff0, #a78bfa); border-radius: 4px; transition: width 0.3s; }
#tinder-stack { position: relative; width: 100%; max-width: 480px; flex: 1; padding: 0 12px 8px; display: flex; align-items: stretch; justify-content: center; overflow: hidden; }
.tinder-card { position: absolute; width: calc(100% - 24px); max-width: 456px; top: 0; bottom: 0; background: #10131a; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6); cursor: grab; user-select: none; touch-action: none; display: flex; flex-direction: column; }
.tinder-photo-wrap { position: relative; flex-shrink: 0; height: 52%; overflow: hidden; transition: height 0.3s ease; }
.tinder-photo-wrap.shrunk { height: 22%; }
.tinder-photo-wrap img { width: 100%; height: 100%; object-fit: cover; background: #1a1d2a; display: block; }
.tinder-photo-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(to top, rgba(10,11,14,0.95) 0%, rgba(10,11,14,0.5) 50%, transparent 100%); pointer-events: none; }
.tinder-photo-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 16px 12px; pointer-events: none; }
.tinder-card-title { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2; }
.tinder-card-price { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.tinder-price-val { color: #a78bfa; font-size: 22px; font-weight: 800; }

    <!-- RESULTS -->

  <!-- FAVORITES TAB -->

<script>
const APP_VERSION = 'v1.5.0';
const BRAND_MODELS = {
  'BMW': ['1', '2', '3', '4', '5', '6', '7', '8', 'X1', 'X2', 'X3', 'X4', 'X5', 'X6', 'X7', 'Z4', 'M'],
  'Audi': ['A1', 'A3', 'A4', 'A5', 'A6', 'A7', 'A8', 'Q2', 'Q3', 'Q5', 'Q7', 'Q8'],
  'Volkswagen': ['Golf', 'Polo', 'Passat', 'Tiguan', 'Touran', 'T-Roc', 'T-Cross', 'Caddy', 'Taigo', 'Touareg', 'ID.4'],
  'Mercedes-Benz': ['A Klasė', 'B Klasė', 'C Klasė', 'E Klasė', 'S Klasė', 'CLA Klasė', 'GLA', 'GLC', 'GLE', 'ML Klasė', 'Vito', 'Sprinter'],
  'Opel': ['Astra', 'Corsa', 'Insignia', 'Mokka', 'Zafira', 'Meriva', 'Grandland X', 'Vivaro'],
  'Ford': ['Focus', 'Fiesta', 'Kuga', 'Mondeo', 'S-Max', 'Galaxy', 'Puma', 'Mustang', 'Transit'],
  'Volvo': ['S60', 'S80', 'V40', 'V50', 'V60', 'V70', 'XC40', 'XC60', 'XC70', 'XC90'],
  'Toyota': ['Corolla', 'Yaris', 'Avensis', 'Auris', 'RAV4', 'C-HR', 'Yaris Cross', 'Prius', 'Land Cruiser'],
  'Skoda': ['Octavia', 'Fabia', 'Superb', 'Kodiaq', 'Karoq', 'Scala'],
  'Peugeot': ['208', '308', '3008', '5008', '2008', '508'],
  'Nissan': ['Qashqai', 'X-Trail', 'Juke', 'Micra', 'Leaf'],
  'Hyundai': ['i30', 'i20', 'Tucson', 'Santa Fe', 'Kona'],
  'Kia': ['Ceed', 'Sportage', 'Sorento', 'Rio', 'Niro'],
  'Renault': ['Clio', 'Megane', 'Kadjar', 'Scenic', 'Captur'],
  'Mazda': ['3', '6', 'CX-5', 'CX-3', 'CX-30'],
  'Honda': ['Civic', 'CR-V', 'Accord', 'Jazz'],
  'Porsche': ['911', 'Cayenne', 'Macan', 'Panamera', 'Taycan'],
  'Land Rover': ['Discovery', 'Range Rover', 'Range Rover Sport', 'Range Rover Evoque', 'Defender'],
  'Lexus': ['IS', 'ES', 'RX', 'NX', 'CT'],
};

const SEARCH_HISTORY_KEY = 'carTriageSearchHistory';
const ANALYSIS_CACHE_KEY = 'carTriageAnalysisCache';
const ANALYSIS_CACHE_TTL = 7 * 24 * 60 * 60 * 1000;
const FAVORITES_KEY = 'carTriageFavorites';
const MAX_HISTORY = 8;

// ===== CACHE =====
function getAnalysisCache(url) {
  try {
    const store = JSON.parse(localStorage.getItem(ANALYSIS_CACHE_KEY) || '{}');
    const entry = store[url];
    if (!entry) return null;
    if (Date.now() - entry.savedAt > ANALYSIS_CACHE_TTL) return null;
    return entry.data;
  } catch { return null; }
}
function setAnalysisCache(url, data) {
  try {
    const store = JSON.parse(localStorage.getItem(ANALYSIS_CACHE_KEY) || '{}');
    store[url] = { data, savedAt: Date.now() };
    const keys = Object.keys(store);
    if (keys.length > 100) keys.sort((a,b) => store[a].savedAt - store[b].savedAt).slice(0, keys.length-100).forEach(k => delete store[k]);
    localStorage.setItem(ANALYSIS_CACHE_KEY, JSON.stringify(store));
  } catch {}
}

// ===== HISTORY =====
function loadSearchHistory() {
  try { return JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY)) || []; } catch { return []; }
}
function saveSearchToHistory(filters) {
  let history = loadSearchHistory();
  const key = JSON.stringify(filters);
  history = history.filter(h => JSON.stringify(h.filters) !== key);
  history.unshift({ filters, savedAt: Date.now() });
  history = history.slice(0, MAX_HISTORY);
  localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history));
  renderSearchHistoryChips();
}
function historyLabel(f) {
  const parts = [f.marke, f.modelis].filter(Boolean).join(' ');
  const years = [f.metaiNuo, f.metaiIki].filter(Boolean).join('–');
  const price = f.kainaIki ? `≤${Number(f.kainaIki).toLocaleString('lt-LT')}€` : '';
  return [parts, years, price].filter(Boolean).join(' · ') || 'Paieška';
}
function renderSearchHistoryChips() {
  const history = loadSearchHistory();
  const wrap = document.getElementById('history-chips-wrap');
  const chips = document.getElementById('search-history-chips');
  if (history.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  chips.innerHTML = history.map((h,i) =>
    `<button class="history-chip" onclick="applyHistoryFilters(${i})">${historyLabel(h.filters)}</button>`
  ).join('');
}
function renderSearchHistoryPanel() {
  const history = loadSearchHistory();
  const el = document.getElementById('history-main-content');
  if (history.length === 0) { el.innerHTML = '<div style="color:#6a6f88;font-size:14px;padding:24px 0;">Paieškos istorija tuščia.</div>'; return; }
  el.innerHTML = `<div style="margin-bottom:12px;font-size:13px;color:#6a6f88;">Spustelėkite, kad užpildytumėte filtrus:</div>` +
    history.map((h,i) => `
      <div style="background:#10131a;border:1px solid #1e2130;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;" onclick="applyHistoryFilters(${i}); switchTab('search')">
        <div style="font-weight:600;color:#e2e4f0;margin-bottom:4px;">${historyLabel(h.filters)}</div>
        <div style="font-size:11px;color:#4a4f6a;">${new Date(h.savedAt).toLocaleString('lt-LT')}</div>
      </div>`).join('');
}
function applyHistoryFilters(idx) {
  const history = loadSearchHistory();
  const f = history[idx] && history[idx].filters;
  if (!f) return;
  document.getElementById('marke').value = f.marke || 'BMW';
  updateModels();
  document.getElementById('modelis').value = f.modelis || '';
  document.getElementById('pavaru_deze').value = f.pavaru_deze || '';
  document.getElementById('metaiNuo').value = f.metaiNuo || '';
  document.getElementById('metaiIki').value = f.metaiIki || '';
  document.getElementById('ridaIki').value = f.ridaIki || '';
  document.getElementById('kainaNuo').value = f.kainaNuo || '';
  document.getElementById('kainaIki').value = f.kainaIki || '';
  document.getElementById('maxPages').value = f.maxPages || '3';
  document.getElementById('portal-autoplius').checked = !f.portals || f.portals.includes('autoplius');
  document.getElementById('portal-autogidas').checked = !f.portals || f.portals.includes('autogidas');
  document.getElementById('portal-autoscout24').checked = !!(f.portals && f.portals.includes('autoscout24'));
  document.getElementById('portal-otomoto').checked = !!(f.portals && f.portals.includes('otomoto'));
  updateGenerationHint();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== FAVORITES =====
function loadFavorites() {
  try { return JSON.parse(localStorage.getItem(FAVORITES_KEY)) || []; } catch { return []; }
}
function saveFavorites(list) { localStorage.setItem(FAVORITES_KEY, JSON.stringify(list)); }
function isFavorited(url) { return loadFavorites().some(f => f.url === url); }
function toggleFavorite(url, snapshot, btn) {
  let favs = loadFavorites();
  const idx = favs.findIndex(f => f.url === url);
  if (idx >= 0) {
    favs.splice(idx, 1);
    if (btn) { btn.textContent = '☆'; btn.classList.remove('active'); }
  } else {
    favs.unshift({ url, modelis: snapshot.modelis, kaina: snapshot.kaina, metai: snapshot.metai, rida: snapshot.rida, photo: snapshot.photo, source: snapshot.source, savedAt: Date.now(), lastKnownPrice: snapshot.kaina, lastCheckedAt: null, status: 'active' });
    if (btn) { btn.textContent = '★'; btn.classList.add('active'); }
  }
  saveFavorites(favs);
  renderFavoritesMain();
}
function renderFavoritesMain() {
  const favs = loadFavorites();
  const el = document.getElementById('favorites-main-content');
  // Update nav tab count
  const tab = document.querySelector('.nav-tab:nth-child(2)');
  if (tab) tab.textContent = `⭐ Favoritai${favs.length > 0 ? ' (' + favs.length + ')' : ''}`;
  if (favs.length === 0) { el.innerHTML = '<div style="color:#6a6f88;font-size:14px;padding:24px 0;">Dar nėra išsaugotų favoritų.</div>'; return; }
  el.innerHTML = `
    <div style="margin-bottom:12px;">
      <button onclick="checkAllFavorites()" style="padding:9px 14px;background:#10131a;color:#e2e4f0;border:1px solid #1e2130;border-radius:8px;font-size:12px;cursor:pointer;">🔄 Patikrinti visų kainas</button>
    </div>
    <div class="favs-panel">
      ${favs.map((f,i) => {
        let statusLine = '';
        if (f.status==='removed') statusLine = `<div style="color:#f87171;font-size:12px;">❌ Skelbimas pašalintas</div>`;
        else if (f.status==='reserved') statusLine = `<div style="color:#f0c674;font-size:12px;">🔒 Rezervuotas</div>`;
        else if (f.lastKnownPrice && f.currentPrice && f.currentPrice !== f.lastKnownPrice) {
          const dropped = f.currentPrice < f.lastKnownPrice;
          statusLine = `<div style="color:${dropped?'#34d399':'#f87171'};font-size:12px;">${dropped?'📉':'📈'} ${formatEUR(f.lastKnownPrice)} → ${formatEUR(f.currentPrice)}</div>`;
        }
        return `<div class="fav-row">
          <img src="${f.photo||''}" onerror="this.style.display='none'">
          <div style="flex:1;font-size:13px;">
            <a href="${f.url}" target="_blank" style="color:#e2e4f0;text-decoration:none;font-weight:600;">${f.modelis}</a>
            <span class="source-tag">${f.source}</span>
            <div style="color:#6a6f88;font-size:12px;">${formatEUR(f.currentPrice||f.kaina)} · ${f.metai||'?'}</div>
            ${statusLine}
          </div>
          <button onclick="checkSingleFavorite(${i})" style="background:#1a1d2a;color:#e2e4f0;border:none;padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer;">🔄</button>

let logExpanded = false;
function toggleLog() {
  logExpanded = !logExpanded;
  document.getElementById('log-box').style.display = logExpanded ? 'block' : 'none';
  document.getElementById('log-header').classList.toggle('expanded', logExpanded);

const PENDING_MARKERS = ['🔎','📄','🔍','🔧','🌐','🔑','⚖️','⏳','🤖'];
const DONE_MARKERS = ['✅','⚠','🎉','❌'];
function lineIsPending(line, jobStatus) {
  if (jobStatus !== 'running') return false;
  const trimmed = line.trim();
  if (DONE_MARKERS.some(m => trimmed.startsWith(m))) return false;
  return PENDING_MARKERS.some(m => trimmed.startsWith(m));
}
function renderLogSteps(log, logBox, jobStatus) {
  logBox.innerHTML = log.map(line => {
    const isRunning = lineIsPending(line, jobStatus);
    const icon = isRunning ? '<span class="spinner"></span>' : '<span class="done-check">✓</span>';
    return `<div class="log-step${isRunning?' current':''}">${icon}<span>${line}</span></div>`;
  }).join('');
  if (logExpanded) logBox.scrollTop = logBox.scrollHeight;
  const headerIcon = document.getElementById('log-header-icon');
  const headerText = document.getElementById('log-header-text');
  const pendingLines = log.filter(l => lineIsPending(l, jobStatus));
  const lastLine = pendingLines.length > 0 ? pendingLines[pendingLines.length-1] : (log[log.length-1] || 'Paleidžiama...');
  const progressFill = document.getElementById('search-progress-fill-main');
  const progressLabel = document.getElementById('search-progress-label');
  if (progressFill && progressLabel) {
    const doneSteps = log.filter(l => !lineIsPending(l, jobStatus)).length;
    let pct;
    if (jobStatus === 'done') { pct = 100; }
    else { const estimated = Math.max(log.length+2, window.__estimatedSearchSteps||45); pct = Math.min(94, Math.round((doneSteps/estimated)*100)); }
    progressFill.style.width = pct + '%';
    progressLabel.textContent = pct + '%  (' + log.length + ' žingsniai)';
  }
  if (jobStatus === 'running') { headerIcon.outerHTML='<span class="spinner" id="log-header-icon"></span>'; headerText.textContent=lastLine; }
  else if (jobStatus === 'done') { headerIcon.outerHTML='<span class="done-check" id="log-header-icon">✓</span>'; headerText.textContent=`Baigta! (${log.length} žingsnių)`; }
  else { headerIcon.outerHTML='<span id="log-header-icon">⚠️</span>'; headerText.textContent='Klaida'; }
}

// ===== SCORE CALC =====
function calcCarScore(c) {
  let kainaScore;
  if (c.diffPct != null) {
    if (c.diffPct>=30) kainaScore=9.5; else if (c.diffPct>=20) kainaScore=8.5; else if (c.diffPct>=10) kainaScore=7.5; else if (c.diffPct>=5) kainaScore=6.5; else kainaScore=5.0;
  } else { kainaScore=5.5; }
  let ridaScore;
  if (c.ridaDiffPct != null) {
    if (c.ridaDiffPct<=-30) ridaScore=9.5; else if (c.ridaDiffPct<=-20) ridaScore=8.5; else if (c.ridaDiffPct<=-10) ridaScore=7.5; else if (c.ridaDiffPct<=10) ridaScore=6.5; else if (c.ridaDiffPct<=25) ridaScore=5.5; else ridaScore=4.0;
  } else { ridaScore=6.5; }
  let irangaScore=6.0;
  if (c.turiIstorijosAtaskaita) irangaScore+=1.0;
  if (c.turiVin) irangaScore+=0.5;
  if (c.garantijosTipas) irangaScore+=1.5;
  irangaScore=Math.min(10,irangaScore);
  let istorijaScore=6.0;
  if (c.turiIstorijosAtaskaita) istorijaScore+=2.0;
  if (c.turiVin) istorijaScore+=1.0;
  istorijaScore=Math.min(10,istorijaScore);
  const potencialaScore = c.qualityScore ? Math.min(10,Math.max(1,c.qualityScore)) : 6.0;
  const overall = kainaScore*0.30 + ridaScore*0.20 + irangaScore*0.20 + istorijaScore*0.15 + potencialaScore*0.15;
  return { overall:Math.round(overall*10)/10, kaina:Math.round(kainaScore*10)/10, rida:Math.round(ridaScore*10)/10, iranga:Math.round(irangaScore*10)/10, istorija:Math.round(istorijaScore*10)/10, potencialas:Math.round(potencialaScore*10)/10 };
}
function buildInsights(c) {
  const badges = [];
  if (c.diffPct>=20) badges.push({type:'good',text:`−${c.diffPct}% nuo rinkos`});
  else if (c.diffPct>=8) badges.push({type:'ok',text:`−${c.diffPct}% nuo rinkos`});
  if (c.ridaDiffPct!=null&&c.ridaDiffPct<=-20) badges.push({type:'good',text:`Maža rida −${Math.abs(c.ridaDiffPct)}%`});
  else if (c.ridaDiffPct!=null&&c.ridaDiffPct>=25) badges.push({type:'warn',text:`Didelė rida +${c.ridaDiffPct}%`});
  if (c.turiIstorijosAtaskaita) badges.push({type:'good',text:'Patikrinta istorija'});
  if (c.garantijosTipas) badges.push({type:'good',text:'Garantija'});
  if (c.turiVin) badges.push({type:'ok',text:'VIN nurodytas'});
  if (c.diffPct>=40) badges.push({type:'warn',text:'⚠ Labai didelė nuolaida'});
  return badges.slice(0,4);
}
function scoreColor(score) {
  if (score>=7.5) return '#34d399'; if (score>=5.5) return '#fb923c'; return '#f87171';
}
function subScoreFillClass(score) {
  if (score>=7.5) return 'score-fill-good'; if (score>=5.5) return 'score-fill-ok'; return 'score-fill-bad';

function scoreRingSVG(score, color) {
  const r=34, circ=2*Math.PI*r, offset=circ-(score/10)*circ;
  return `<svg viewBox="0 0 80 80" width="80" height="80"><circle cx="40" cy="40" r="${r}" fill="none" stroke="#1a1d2a" stroke-width="7"/><circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 40 40)"/></svg>`;
}

  if (extra.dataset.loaded==='true') { extra.style.display=extra.style.display==='none'?'block':'none'; return; }
  extra.style.display='block';
  if (c.deepAnalysis) { extra.innerHTML=buildDetailPanelHTML({analysis:c.deepAnalysis,vin:c.vin,pardavejas:c.pardavejas,photos:c.photos,cached:false},c.url,'tinder-detail-extra'); extra.dataset.loaded='true'; return; }
  const cached=getAnalysisCache(c.url);
  if (cached) { extra.innerHTML=buildDetailPanelHTML(cached,c.url,'tinder-detail-extra'); extra.dataset.loaded='true'; return; }
  extra.innerHTML='<span style="color:#6a6f88;font-size:12px;">🔬 Kraunama...</span>';
  try {
    const resp=await fetch('/api/analyze-single',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:c.url})});
    const data=await resp.json();
    if (data.error){extra.innerHTML=`<span style="color:#f87171;font-size:12px;">Klaida: ${data.error}</span>`;return;}
    setAnalysisCache(c.url,data); extra.innerHTML=buildDetailPanelHTML(data,c.url,'tinder-detail-extra'); extra.dataset.loaded='true';
  } catch(err){extra.innerHTML=`<span style="color:#f87171;font-size:12px;">Klaida: ${err.message}</span>`;}
}
function attachSwipeHandlers(el) {
  let startX=0,startY=0,dx=0,dragging=false;
  const likeBadge=document.getElementById('tinder-badge-like');
  const skipBadge=document.getElementById('tinder-badge-skip');
  function onMove(clientX,clientY){dx=clientX-startX;const dy=clientY-startY;el.style.transform=`translate(${dx}px,${dy*0.2}px) rotate(${dx/18}deg)`;const opacity=Math.min(Math.abs(dx)/100,1);if(dx>0){likeBadge.style.opacity=opacity;skipBadge.style.opacity=0;}else{skipBadge.style.opacity=opacity;likeBadge.style.opacity=0;}}
  function onEnd(){dragging=false;if(dx>100)tinderSwipe('right');else if(dx<-100)tinderSwipe('left');else{el.style.transition='transform 0.25s ease-out';el.style.transform='';likeBadge.style.opacity=0;skipBadge.style.opacity=0;}}
  el.addEventListener('touchstart',e=>{dragging=true;startX=e.touches[0].clientX;startY=e.touches[0].clientY;el.style.transition='none';});
  el.addEventListener('touchmove',e=>{if(!dragging)return;onMove(e.touches[0].clientX,e.touches[0].clientY);});
  el.addEventListener('touchend',onEnd);
  el.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX;startY=e.clientY;el.style.transition='none';el.style.cursor='grabbing';});
  window.addEventListener('mousemove',e=>{if(!dragging)return;onMove(e.clientX,e.clientY);});
  window.addEventListener('mouseup',()=>{if(!dragging)return;el.style.cursor='grab';onEnd();});
}
function tinderSwipe(direction) {
  const el=document.getElementById('tinder-card-current');
  const c=tinderQueue[tinderIndex];
  if (el){el.style.transition='transform 0.35s ease-out';el.style.transform=`translate(${direction==='right'?700:-700}px,-40px) rotate(${direction==='right'?25:-25}deg)`;}
  if (direction==='right'&&c) tinderLiked.push(c); else if (direction==='left'&&c) tinderSkipped.push(c);
  setTimeout(()=>{tinderIndex++;renderTinderCard();},220);
}
function startTinderRest() {
  const rest=window.__tinderRestListings||[];
  if (rest.length===0) return;
  tinderPhase='rest';
  tinderQueue=rest.map(l=>({...l,source:l.source||(l.url&&l.url.includes('autoscout24')?'autoscout24.com':l.url&&l.url.includes('otomoto')?'otomoto.pl':l.url&&l.url.includes('autogidas')?'autogidas.lt':'autoplius.lt'),comment:l.comment||'',diffPct:l.diffPct||0}));
  tinderIndex=0;
  document.getElementById('tinder-actions').style.display='flex';
  document.getElementById('tinder-hint').style.display='block';
  renderTinderCard();
}
document.addEventListener('keydown',e=>{
  if (!document.getElementById('tinder-view').classList.contains('active')) return;
  if (e.key==='ArrowLeft') tinderSwipe('left');
  if (e.key==='ArrowRight') tinderSwipe('right');
  if (e.key==='Escape') exitTinder();
});

// ===== LIGHTBOX =====
let lightboxPhotos=[], lightboxIndex=0;
function openLightbox(photos, startIndex) { lightboxPhotos=photos; lightboxIndex=startIndex; document.getElementById('lightbox').classList.add('active'); document.body.style.overflow='hidden'; renderLightbox(); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); document.body.style.overflow=''; }
function lightboxNav(dir) { lightboxIndex=(lightboxIndex+dir+lightboxPhotos.length)%lightboxPhotos.length; renderLightbox(); }
function renderLightbox() { document.getElementById('lightbox-img').src=lightboxPhotos[lightboxIndex]; document.getElementById('lightbox-counter').textContent=`${lightboxIndex+1} / ${lightboxPhotos.length}`; const multi=lightboxPhotos.length>1; document.getElementById('lightbox-prev').style.display=multi?'block':'none'; document.getElementById('lightbox-next').style.display=multi?'block':'none'; }
document.addEventListener('keydown',e=>{
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key==='ArrowLeft') lightboxNav(-1);
  if (e.key==='ArrowRight') lightboxNav(1);
  if (e.key==='Escape') closeLightbox();
});
function cyclePhoto(cardId,dir) {
  window.__galleryStore=window.__galleryStore||{}; window.__cardPhotoIndex=window.__cardPhotoIndex||{};
  const photos=window.__galleryStore[cardId+'-strip'];
  if (!photos||photos.length<2) return;
  let idx=window.__cardPhotoIndex[cardId]||0;
  idx=(idx+dir+photos.length)%photos.length;
  window.__cardPhotoIndex[cardId]=idx;
  const img=document.getElementById(cardId+'-img');
  if (img) img.src=photos[idx];
  const counter=document.getElementById(cardId+'-photocount');
  if (counter) counter.textContent=`${idx+1}/${photos.length}`;
}

// ===== UTILS =====
function escJs(s) { return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' '); }
function formatEUR(n) { if (n===null||n===undefined) return '?'; return n.toLocaleString('lt-LT').replace(/,/g,' ')+' €'; }
function formatRidaDiff(pct) { return pct>=100?`${(pct/100+1).toFixed(1)} karto`:`${pct}%`; }

// ===== RESULTS =====
let currentData=null;
function renderResults(data, status, results) {
  currentData=data;
  const rawNote=data.rawFoundCount&&data.rawFoundCount!==data.totalScanned?` (iš ${data.rawFoundCount} pagal markę/modelį, ${data.totalScanned} atitiko filtrus)`:'';
  status.textContent=`Rasta ${data.candidates.length} verti dėmesio${rawNote}:`;
  document.getElementById('sort-bar').style.display=data.candidates.length>0?'flex':'none';
  document.getElementById('sort-select').value='quality';
  renderCandidateCards(data.candidates, results);
  renderAllListings(data.allListings||[]);
}
function applySorting() {
  if (!currentData) return;
  const mode=document.getElementById('sort-select').value;
  const sorted=[...currentData.candidates];
  if (mode==='cheapest') sorted.sort((a,b)=>a.kaina-b.kaina);
  else if (mode==='priciest') sorted.sort((a,b)=>b.kaina-a.kaina);
  else if (mode==='biggest-discount') sorted.sort((a,b)=>b.diffPct-a.diffPct);
  else sorted.sort((a,b)=>b.qualityScore-a.qualityScore);
  renderCandidateCards(sorted, document.getElementById('results'));
}

    const cardId=`detail-${idx}-${c.url.length}`;
    const scores=calcCarScore(c);
    const sColor=scoreColor(scores.overall);
    const insights=buildInsights(c);
    const isFav=isFavorited(c.url);
    const favSnapshot=`{modelis:'${escJs(c.modelis)}',kaina:${c.kaina||'null'},metai:${c.metai||'null'},rida:${c.rida||'null'},photo:'${escJs(c.photo||'')}',source:'${escJs(c.source)}'}`;

    const insideBadgeHTML=insights.map(b=>`<span class="insight-badge ${b.type}">${b.text}</span>`).join('');

// ===== DETAIL PANEL =====
function buildDetailPanelHTML(data, url, panelId) {
  const a=data.analysis;
  if (!a) return '<div style="color:#6a6f88;padding:12px;">Nėra analizės duomenų.</div>';
  const listFmt=arr=>arr&&arr.length?'<ul class="detail-list">'+arr.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<span style="color:#4a4f6a;">–</span>';
  const cacheNote=data.cached?`<div class="cache-note">📦 Iš talpyklos (prieš ${data.cacheAgeMinutes} min.) · <a href="#" onclick="event.preventDefault();loadDetail('${url}','${panelId}',document.getElementById('${panelId}-btn'),true);return false;" style="color:#7c6ff0">atnaujinti</a></div>`:'';
  window.__galleryStore=window.__galleryStore||{};
  window.__galleryStore[panelId]=data.photos||[];
  const galleryBlock=data.photos&&data.photos.length>1?`<div class="photo-gallery">${data.photos.map((p,i)=>`<img src="${p}" loading="lazy" onclick="openLightbox(window.__galleryStore['${panelId}'],${i})" onerror="this.style.display='none'">`).join('')}</div>`:'';
  const pr=a&&a.perikupo_radaras;
  const prColor=pr?(pr.procentas>=60?'#34d399':pr.procentas>=30?'#f0c674':'#f87171'):'#6a6f88';
  const pelnoLabelMap={aukstas:'Aukštas',vidutinis:'Vidutinis',zemas:'Žemas',neverta:'Neverta'};
  const perikupoBlock=pr?`<div class="perikupas-box"><div class="perikupas-title">💰 Pelno potencialas: <span style="color:${prColor}">${pelnoLabelMap[pr.pelno_potencialas]||pr.pelno_potencialas} (${pr.procentas}%)</span></div><div style="font-size:12px;color:#c0c4d8;margin-bottom:4px;">${pr.paaiskinimas||''}</div>${pr.numatoma_investicija?`<div style="font-size:12px;color:#6a6f88;">🔧 Investicija: ${pr.numatoma_investicija}</div>`:''} ${pr.numatomas_pardavimo_diapazonas?`<div style="font-size:12px;color:#6a6f88;">🏷️ Galimas pardavimas: ${pr.numatomas_pardavimo_diapazonas}</div>`:''}</div>`:'';
  const vinResultId=`${panelId}-vin-result`;
  const vinBlock=data.vin?`<div class="vin-box"><span style="color:#6a6f88;">VIN:</span> <span class="vin-code">${data.vin}</span> <button class="btn-lookup" onclick="lookupVin('${data.vin}','${vinResultId}',this)">🔎 Ieškoti istorijos</button><div id="${vinResultId}" class="lookup-result"></div></div>`:'';
  const sellerResultId=`${panelId}-seller-result`;
  const sellerBlock=data.pardavejas?`<div class="seller-box"><span style="color:#6a6f88;">Pardavėjas:</span> <b style="color:#e2e4f0;">${data.pardavejas}</b> <button class="btn-lookup" onclick="lookupSeller('${data.pardavejas.replace(/'/g,"\\'")}','${sellerResultId}',this,'${escJs(url)}')">🔎 Tikrinti pardavėją</button><div id="${sellerResultId}" class="lookup-result"></div></div>`:'';
  const irangaChips=a.irangos_akcentai&&a.irangos_akcentai.length>0?`<div class="equipment-chips">${a.irangos_akcentai.map(x=>`<span class="equipment-chip">${x}</span>`).join('')}</div>`:'<span style="color:#4a4f6a;">–</span>';
  const photoDamageBlock=a.nuotrauku_pastebejimai&&a.nuotrauku_pastebejimai.length>0?`<div class="photo-damage-box"><div class="photo-damage-title">👁️ AI matomi pažeidimai nuotraukose</div>${listFmt(a.nuotrauku_pastebejimai)}</div>`:'';
  const crossListBlock=data.kryzminiaiSkelbimai&&data.kryzminiaiSkelbimai.length>0?`<div class="cross-list-box">🔗 Tas pats automobilis: ${data.kryzminiaiSkelbimai.map(k=>`${k.source} už ${formatEUR(k.kaina)}`).join(', ')}</div>`:'';

  // Build tabbed HTML
  return `
    ${cacheNote}

      <button class="detail-tab active" onclick="switchDetailTab(this,'${panelId}-pane-ai')">🤖 AI analizė</button>

      <div class="detail-tab-pane active" id="${panelId}-pane-ai">
        <div class="detail-verdict">${a.verdiktas||''}</div>
        <div class="detail-section-label">✅ Privalumai</div>${listFmt(a.privalumai)}
        <div class="detail-section-label">⚠️ Rizikos</div>${listFmt(a.rizikos)}

        <div class="detail-section-label">❓ Klausimai pardavėjui</div>${listFmt(a.klausimai_pardavejui)}

      <div class="detail-tab-pane" id="${panelId}-pane-hist">

      </div>
      <div class="detail-tab-pane" id="${panelId}-pane-market">
        ${perikupoBlock}${crossListBlock}
        ${!pr&&!crossListBlock?'<div style="color:#4a4f6a;font-size:13px;">Nėra rinkos duomenų.</div>':''}
      </div>
      ${data.photos&&data.photos.length>0?`<div class="detail-tab-pane" id="${panelId}-pane-photos">${galleryBlock}</div>`:''}
    </div>`;
}

function switchDetailTab(btn, paneId) {
  const tabsEl=btn.parentElement;
  const contentEl=tabsEl.nextElementSibling;
  tabsEl.querySelectorAll('.detail-tab').forEach(t=>t.classList.remove('active'));
  contentEl.querySelectorAll('.detail-tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const pane=document.getElementById(paneId);
  if (pane) pane.classList.add('active');
}

async function loadDetail(url, panelId, btn, force, marketContext) {
  const panel=document.getElementById(panelId);
  if (panel.dataset.loaded==='true'&&!force) {
    const isHidden=panel.style.display==='none';
    panel.style.display=isHidden?'block':'none';
    btn.textContent=isHidden?'🔼 Slėpti apžvalgą':(btn.dataset.closedLabel||'🔬 Detali apžvalga');
    return;
  }
  btn.disabled=true;
  panel.style.display='block';
  const detailMessages=['📖 Skaitau aprašymą...','🔧 Renku techninę specifikaciją...','🔑 Ieškau VIN ir pardavėjo...','🌐 Tikrinu žinomus gedimus...','⚖️ Vertinu rizikas...','✍️ Ruošiu derybų patarimą...'];
  let pct=0, msgIdx=0;
  panel.innerHTML=`<div class="detail-tab-content"><span style="color:#6a6f88">${detailMessages[0]} (0%)</span></div>`;
  const ticker=setInterval(()=>{
    pct=Math.min(pct+Math.random()*8,92);
    msgIdx=Math.min(Math.floor((pct/100)*detailMessages.length),detailMessages.length-1);
    btn.textContent=`⏳ ${Math.round(pct)}%`;
    const span=panel.querySelector('span');
    if (span) span.textContent=`${detailMessages[msgIdx]} (${Math.round(pct)}%)`;
  },600);
  try {
    const resp=await fetch('/api/analyze-single',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,force:!!force,...(marketContext||{})})});
    const data=await resp.json();
    clearInterval(ticker);
    if (data.error){panel.innerHTML=`<div class="detail-tab-content"><span style="color:#f87171">Klaida: ${data.error}</span></div>`;return;}
    panel.innerHTML=buildDetailPanelHTML(data,url,panelId);
    panel.dataset.loaded='true';
    btn.textContent='🔼 Slėpti apžvalgą';
    btn.disabled=false;
    return;
  } catch(err){clearInterval(ticker);panel.innerHTML=`<div class="detail-tab-content"><span style="color:#f87171">Klaida: ${err.message}</span></div>`;}
  finally{btn.disabled=false;if(btn.textContent.includes('%')||btn.textContent.includes('⏳'))btn.textContent='🔬 Detali apžvalga';}
}

// ===== ALL LISTINGS =====
function renderAllListings(allListings) {
  const wrap=document.getElementById('all-listings-wrap');
  const container=document.getElementById('all-listings');
  if (allListings.length===0){wrap.style.display='none';return;}
  wrap.style.display='block';
  container.innerHTML=allListings.map((l,idx)=>{
    const specs=[l.kuras,l.pavarai,l.variklioTuris?`${l.variklioTuris}L`:null,l.galia?`${l.galia}kW`:null].filter(Boolean).join(' · ');
    const panelId=`all-detail-${idx}`;
    const reasonId=`all-reason-${idx}`;
    const candidateBadge=l.isCandidate?'<span style="font-size:10px;background:#162a1e;color:#34d399;padding:2px 6px;border-radius:4px;margin-left:4px;">✓ TOP</span>':'';
    const rejectionToggle=!l.isCandidate&&l.rejectionReasons&&l.rejectionReasons.length>0?`<div><a href="#" onclick="event.preventDefault();toggleReason('${reasonId}',this);" style="color:#6a6f88;font-size:11px;">❓ Kodėl neatrinktas? ▾</a><div id="${reasonId}" style="display:none;margin-top:4px;"><ul style="margin:0;padding-left:16px;font-size:11px;color:#6a6f88;">${l.rejectionReasons.map(r=>`<li>${r}</li>`).join('')}</ul></div></div>`:'';
    return `<div style="padding:8px;border-bottom:1px solid #1a1d2a;"><div style="display:flex;gap:10px;align-items:center;"><img src="${l.photo||''}" onerror="this.style.display='none'" style="width:60px;height:44px;object-fit:cover;border-radius:4px;background:#1a1d2a;flex-shrink:0;"><div style="flex:1;font-size:13px;"><a href="${l.url}" target="_blank" style="color:#e2e4f0;text-decoration:none;font-weight:600;">${l.modelis}</a><span class="source-tag">${l.source}</span>${candidateBadge}${l.turiVin?'<span style="color:#34d399;font-size:11px;margin-left:4px;">VIN</span>':''}<div style="color:#6a6f88;font-size:12px;">${formatEUR(l.kaina)} · ${l.metai||'?'} · ${l.rida?l.rida.toLocaleString('lt-LT').replace(/,/g,' ')+' km':'?'}${specs?' · '+specs:''}</div>${rejectionToggle}</div><button class="btn-detail" id="${panelId}-btn" onclick="loadDetail('${l.url}','${panelId}',this,false,{kaina:${l.kaina||'null'},marketMedian:${l.marketMedian||'null'},marketCount:${l.marketCount||'null'},diffPct:${l.diffPct!=null?l.diffPct:'null'},modelis:'${escJs(l.modelis)}',pardavejas:${l.pardavejas?`'${escJs(l.pardavejas)}'`:'null'},galia:${l.galia||'null'},variklioTuris:${l.variklioTuris||'null'}})" style="flex-shrink:0;">🔬 Detali apžvalga</button></div><div class="detail-panel" id="${panelId}" style="margin-top:8px;"></div></div>`;
  }).join('');
}
function toggleReason(id,link) { const el=document.getElementById(id); const isHidden=el.style.display==='none'; el.style.display=isHidden?'block':'none'; link.textContent=isHidden?'❓ Kodėl neatrinktas? ▴':'❓ Kodėl neatrinktas? ▾'; }
function toggleAllListings() { const el=document.getElementById('all-listings'); const btn=document.getElementById('toggle-all-btn'); const isHidden=el.style.display==='none'; el.style.display=isHidden?'block':'none'; btn.textContent=isHidden?'📋 Slėpti visus nuskaitytus skelbimus ▴':'📋 Rodyti visus nuskaitytus skelbimus ▾'; }

// ===== VIN / SELLER LOOKUP =====
function startRotatingStatus(el,messages,intervalMs=1800) {
  let i=0; el.innerHTML=`<span style="color:#6a6f88;font-size:12px;">${messages[0]}</span>`;
  const timer=setInterval(()=>{i=(i+1)%messages.length;const span=el.querySelector('span');if(span)span.textContent=messages[i];},intervalMs);
  return ()=>clearInterval(timer);
}
async function lookupVin(vin,resultId,btn) {
  const resultEl=document.getElementById(resultId);
  btn.disabled=true; btn.textContent='⏳ Ieškoma...';
  const stopRotating=startRotatingStatus(resultEl,['🔍 Tikrinu VIN kodą viešose bazėse...','🌐 Naršau JAV aukcionų archyvus...','📋 Ieškau aukciono istorijos...','📝 Ruošiu santrauką...']);
  try {
    const resp=await fetch('/api/vin-lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vin})});
    const data=await resp.json();
    stopRotating();
    if (data.error){resultEl.innerHTML=`<span style="color:#f87171;font-size:12px;">Klaida: ${data.error}</span>`;return;}
    const cacheNote=data.cached?`<span style="color:#444;"> (talpykla, prieš ${data.cacheAgeMinutes} min.)</span>`:'';
    if (!data.rasta){resultEl.innerHTML=`<div style="font-size:12px;color:#4a4f6a;background:#0d1018;padding:8px;border-radius:6px;">Viešai prieinamos informacijos nerasta.${cacheNote}</div>`;}
    else{resultEl.innerHTML=`<div class="vin-found"><div style="color:#f87171;font-weight:600;">⚠️ Rasta informacija${cacheNote}</div>${data.saltinis?`<div>📍 Šaltinis: ${data.saltinis}</div>`:''}${data.zalos_aprasas?`<div>🔧 Žala: ${data.zalos_aprasas}</div>`:''}${data.aukciono_kaina?`<div>💰 Aukciono kaina: ${data.aukciono_kaina}</div>`:''}${data.papildoma_info?`<div>ℹ️ ${data.papildoma_info}</div>`:''}${data.nuoroda?`<div><a href="${data.nuoroda}" target="_blank" style="color:#7c6ff0;">Šaltinio nuoroda →</a></div>`:''}</div>`;}
  } catch(err){stopRotating();resultEl.innerHTML=`<span style="color:#f87171;font-size:12px;">Klaida: ${err.message}</span>`;}
  finally{btn.disabled=false;btn.textContent='🔎 Ieškoti VIN istorijos';}
}
async function lookupSeller(pardavejas,resultId,btn,listingUrl) {
  const resultEl=document.getElementById(resultId);
  btn.disabled=true; btn.textContent='⏳ Ieškoma...';
  const stopRotating=startRotatingStatus(resultEl,[`🏢 Ieškau "${pardavejas}" duomenų...`,'⭐ Tikrinu atsiliepimus...','📅 Žiūriu veiklos trukmę...','📝 Ruošiu santrauką...']);
  try {
    const resp=await fetch('/api/seller-lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pardavejas,listingUrl})});
    const data=await resp.json();
    stopRotating();
    if (data.error){resultEl.innerHTML=`<span style="color:#f87171;font-size:12px;">Klaida: ${data.error}</span>`;return;}
    const cacheNote=data.cached?`<span style="color:#444;"> (talpykla, prieš ${data.cacheAgeMinutes} min.)</span>`:'';
    if (!data.rasta){resultEl.innerHTML=`<div style="font-size:12px;color:#4a4f6a;background:#0d1018;padding:8px;border-radius:6px;">Viešai prieinamos informacijos nerasta.${cacheNote}</div>`;}
    else{resultEl.innerHTML=`<div class="seller-found"><div style="color:#34d399;font-weight:600;">🏢 Rasta informacija${cacheNote}</div>${data.imones_pavadinimas?`<div>📛 Pavadinimas: ${data.imones_pavadinimas}</div>`:''}${data.veiklos_trukme?`<div>📅 Veiklos trukmė: ${data.veiklos_trukme}</div>`:''}${data.atsiliepimu_santrauka?`<div>⭐ Atsiliepimai: ${data.atsiliepimu_santrauka}</div>`:''}${data.ispejimai?`<div style="color:#f87171;">⚠️ ${data.ispejimai}</div>`:''}${data.nuoroda?`<div><a href="${data.nuoroda}" target="_blank" style="color:#7c6ff0;">Šaltinio nuoroda →</a></div>`:''}</div>`;}
  } catch(err){stopRotating();resultEl.innerHTML=`<span style="color:#f87171;font-size:12px;">Klaida: ${err.message}</span>`;}
  finally{btn.disabled=false;btn.textContent='🔎 Ieškoti pardavėjo info';}
}

// ===== COMPARE =====
let compareList=[];
function toggleCompare(url,modelis,kaina,photo,metai,rida,kuras,galia,variklioTuris,pavarai,diffPct,marketMedian,source,btnId) {
  const existIdx=compareList.findIndex(c=>c.url===url);
  if (existIdx>=0){compareList.splice(existIdx,1);}
  else{if(compareList.length>=3){alert('Galima palyginti tik iki 3 automobilių.');return;}compareList.push({url,modelis,kaina,photo,metai,rida,kuras,galia,variklioTuris,pavarai,diffPct,marketMedian,source});}
  const btn=document.getElementById(btnId);
  if (btn) btn.classList.toggle('active',compareList.some(c=>c.url===url));
  renderCompareBar();
}
function renderCompareBar() {
  const bar=document.getElementById('compare-bar');
  const itemsEl=document.getElementById('compare-bar-items');
  if (compareList.length===0){bar.classList.remove('visible');document.body.style.paddingBottom='';return;}
  bar.classList.add('visible');
  itemsEl.innerHTML=compareList.map((c,i)=>`<div class="compare-bar-chip"><span>${c.modelis} – ${formatEUR(c.kaina)}</span><button onclick="removeFromCompare(${i})">✕</button></div>`).join('');
  document.getElementById('compare-btn').textContent=`⚖️ Palyginti (${compareList.length})`;
  document.body.style.paddingBottom=compareList.length>0?'70px':'';
}
function removeFromCompare(idx) {
  compareList.splice(idx,1);
  document.querySelectorAll('.btn-compare.active').forEach(btn=>{});
  renderCompareBar();
}
function openCompareModal() {
  if (compareList.length<2){alert('Pasirinkite bent 2 automobilius.');return;}
  const modal=document.getElementById('compare-modal');
  const wrap=document.getElementById('compare-grid-wrap');
  modal.classList.add('active');
  document.body.style.overflow='hidden';
  const cols=compareList.length;
  wrap.style.display='grid'; wrap.style.gridTemplateColumns=`repeat(${cols},1fr)`; wrap.style.gap='12px';
  const allKainos=compareList.map(c=>c.kaina).filter(Boolean);
  const allRidos=compareList.map(c=>c.rida).filter(Boolean);
  const allDiff=compareList.map(c=>c.diffPct).filter(v=>v!=null);
  const minKaina=Math.min(...allKainos),maxKaina=Math.max(...allKainos);
  const minRida=Math.min(...allRidos),maxRida=Math.max(...allRidos);
  const maxDiff=Math.max(...allDiff);
  wrap.innerHTML=compareList.map(c=>{
    const kainaClass=cols>1&&c.kaina===minKaina?'better':c.kaina===maxKaina?'worse':'';
    const ridaClass=cols>1&&c.rida===minRida?'better':c.rida===maxRida?'worse':'';
    const diffClass=cols>1&&c.diffPct===maxDiff?'better':'';
    const rows=[{label:'Kaina',val:formatEUR(c.kaina),cls:kainaClass},{label:'Nuolaida',val:c.diffPct!=null?`-${c.diffPct}%`:'–',cls:diffClass},{label:'Rinkos vidurkis',val:c.marketMedian?formatEUR(c.marketMedian):'–',cls:''},{label:'Metai',val:c.metai||'–',cls:''},{label:'Rida',val:c.rida?c.rida.toLocaleString('lt-LT').replace(/,/g,' ')+' km':'–',cls:ridaClass},{label:'Kuras',val:c.kuras||'–',cls:''},{label:'Galia',val:c.galia?`${c.galia} kW`:'–',cls:''},{label:'Variklio tūris',val:c.variklioTuris?`${c.variklioTuris} L`:'–',cls:''},{label:'Pavarų dėžė',val:c.pavarai||'–',cls:''},{label:'Šaltinis',val:c.source||'–',cls:''}];
    return `<div class="compare-col"><img src="${c.photo||''}" onerror="this.style.display='none'"><div class="compare-col-title">${c.modelis}</div><div class="compare-col-price">${formatEUR(c.kaina)}</div>${rows.map(r=>`<div class="compare-row"><span class="compare-row-label">${r.label}</span><span class="compare-row-val ${r.cls}">${r.val}</span></div>`).join('')}<a href="${c.url}" target="_blank" style="display:block;margin-top:10px;color:#7c6ff0;font-size:12px;text-decoration:none;">Žiūrėti skelbimą →</a></div>`;
  }).join('');
}
function closeCompareModal() { document.getElementById('compare-modal').classList.remove('active'); document.body.style.overflow=''; }
